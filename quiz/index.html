<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Teste da Caneta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&family=DM+Mono:wght@500&display=swap">
<style>
/* Funil de quiz de celular: fundo claro, uma pergunta por tela, manchetes pesadas com palavras marcadas, botões em relevo. Tema claro único, de propósito, como os funis do nicho. */
:root{
  color-scheme:light;
  --bg:#FFFFFF;
  --panel:#F6F7F4;
  --ink:#16201C;
  --muted:#5D6A64;
  --line:#E2E7E3;
  --green:#1E9E45;
  --green-deep:#13722F;
  --green-soft:#E7F6EC;
  --red:#D7342A;
  --red-soft:#FDEBE9;
  --amber:#C97800;
  --amber-soft:#FFF3DF;
  --marker:#FFE14D;
  --font-display:"Archivo","Arial Black","Helvetica Neue",Arial,sans-serif;
  --font-body:"Nunito Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-data:"DM Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:1.0625rem;line-height:1.5;-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
img{max-width:100%}
.shell{max-width:31rem;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px 128px;display:flex;flex-direction:column;gap:16px}
.top{display:flex;flex-direction:column;gap:10px;align-items:center}
.bar{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;width:100%;min-height:44px}
.back{all:unset;cursor:pointer;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.back:hover{background:var(--panel);color:var(--ink)}
.logo{grid-column:2;justify-self:center;display:flex;flex-direction:column;align-items:center;line-height:1}
.logo small{font-family:var(--font-display);font-weight:800;font-size:.56rem;letter-spacing:.2em;color:var(--green)}
.logo b{font-family:var(--font-display);font-weight:900;font-size:1.35rem;letter-spacing:-.02em;color:var(--green);white-space:nowrap}
.logo b span{color:var(--ink)}
.progress{width:100%;height:7px;border-radius:99px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--green);border-radius:99px;transition:width .4s ease}
.screen{display:flex;flex-direction:column;gap:16px;animation:in .3s ease both}
@keyframes in{from{opacity:.001;transform:translateY(10px)}to{opacity:1;transform:none}}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-weight:900;font-size:clamp(1.65rem,7.4vw,2.15rem);line-height:1.08;text-transform:uppercase;text-align:center}
h2{font-weight:800;font-size:clamp(1.35rem,5.8vw,1.65rem);line-height:1.14;text-align:center}
h2.caps{text-transform:uppercase;font-weight:900}
h3{font-weight:800;font-size:1.15rem;line-height:1.2}
p{margin:0}
.c{text-align:center}
.lead{color:var(--muted);text-align:center;font-size:1.02rem}
.hint{color:var(--muted);font-size:.92rem;text-align:center;margin-top:-6px}
.g{color:var(--green)}
.r{color:var(--red)}
.mk{background:linear-gradient(transparent 12%,var(--marker) 12%,var(--marker) 88%,transparent 88%);padding:0 .12em;color:var(--ink)}
.badge{align-self:center;font-family:var(--font-display);font-weight:800;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--green-deep);background:var(--green-soft);border-radius:99px;padding:6px 12px}
.fine{font-size:.78rem;color:var(--muted);text-align:center}
.src{font-size:.75rem;color:var(--muted);text-align:center}
/* botões */
.btn{all:unset;box-sizing:border-box;cursor:pointer;width:100%;min-height:58px;padding:14px 18px;border-radius:12px;background:var(--green);color:#FFFFFF;font-family:var(--font-body);font-weight:800;font-size:1.08rem;text-align:center;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 4px 0 var(--green-deep);text-decoration:none;line-height:1.25;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--green-deep)}
.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.btn.big{min-height:66px;font-size:1.15rem;text-transform:uppercase;font-family:var(--font-display);font-weight:900;letter-spacing:.01em}
.btn.ghost{background:var(--bg);color:var(--ink);border:2px solid var(--line);box-shadow:0 3px 0 var(--line);justify-content:flex-start;text-align:left}
.btn.ghost:hover{border-color:var(--green)}
.btn.ghost[aria-pressed="true"]{border-color:var(--green);background:var(--green-soft)}
.btn .em{font-size:1.3rem;line-height:1}
.pulse{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
.btns{display:flex;flex-direction:column;gap:12px}
.opt{all:unset;box-sizing:border-box;cursor:pointer;width:100%;min-height:56px;padding:13px 16px;border:2px solid var(--line);border-radius:12px;background:var(--bg);display:flex;align-items:center;gap:12px;font-weight:700;font-size:1.03rem;line-height:1.3;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--green)}
.opt .box{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;background:var(--bg)}
.opt[aria-pressed="true"]{border-color:var(--green);background:var(--green-soft)}
.opt[aria-pressed="true"] .box{background:var(--green);border-color:var(--green)}
.opt[aria-pressed="true"] .box::after{content:"";width:10px;height:5px;border:3px solid #FFFFFF;border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}
.opt .em{font-size:1.25rem;line-height:1}
.btn:focus-visible,.opt:focus-visible,.age:focus-visible,.back:focus-visible,summary:focus-visible,.step:focus-visible,input[type=range]:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
/* abertura: idade em cartões */
.ages{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.age{all:unset;box-sizing:border-box;cursor:pointer;border:2px solid var(--line);border-radius:14px;padding:14px 12px;display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--bg);box-shadow:0 3px 0 var(--line);transition:border-color .15s,background .15s}
.age:hover{border-color:var(--green)}
.age[aria-pressed="true"]{border-color:var(--green);background:var(--green-soft)}
.age b{font-family:var(--font-display);font-weight:900;font-size:1.45rem;line-height:1.1}
.age span{font-size:.8rem;color:var(--muted);font-weight:700}
.age:last-child:nth-child(odd){grid-column:1/-1}
.pains{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.pains span{font-size:.78rem;font-weight:800;border-radius:99px;padding:5px 10px;background:var(--red-soft);color:var(--red)}
/* telas de explicação */
.panel{background:var(--panel);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.panel.white{background:var(--bg);border:2px solid var(--line)}
.big-stat{display:flex;align-items:center;gap:14px;background:var(--green-soft);border-radius:16px;padding:14px 16px}
.big-stat b{flex:none;white-space:nowrap;font-family:var(--font-display);font-weight:900;font-size:2.2rem;line-height:1;color:var(--green-deep)}
.big-stat span{font-weight:700;line-height:1.3}
.split{display:flex;height:46px;border-radius:12px;overflow:hidden;font-weight:800;font-size:.85rem;color:#FFFFFF}
.split div{display:grid;place-items:center;text-align:center;line-height:1.1;padding:0 6px}
.split .fat{background:var(--green)}
.split .lean{background:var(--red)}
.mirror{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.mirror li{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;background:var(--panel);border-radius:12px;padding:12px}
.mirror li .ic{font-size:1.3rem;line-height:1.2;text-align:center}
.mirror li b{display:block;line-height:1.25}
.mirror li span{font-size:.9rem;color:var(--muted);line-height:1.35}
.gauge{display:flex;flex-direction:column;gap:8px}
.gauge .row{display:flex;justify-content:space-between;font-weight:700;font-size:.92rem;gap:10px}
.gauge .row b{font-family:var(--font-data);font-weight:500}
.gauge .track{height:14px;border-radius:99px;background:var(--line);overflow:hidden}
.gauge .track i{display:block;height:100%;border-radius:99px}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.compare > div{border-radius:14px;padding:14px 12px;display:flex;flex-direction:column;gap:6px;text-align:center;align-items:center}
.compare .no{background:var(--red-soft)}
.compare .yes{background:var(--green-soft);border:2px solid var(--green)}
.compare .em{font-size:2rem;line-height:1}
.compare b{font-size:.92rem;line-height:1.25}
.compare .num{font-family:var(--font-display);font-weight:900;font-size:1.6rem;line-height:1}
.compare .no .num{color:var(--red)}
.compare .yes .num{color:var(--green-deep)}
.compare small{font-size:.75rem;color:var(--muted);font-weight:700}
/* peso */
.weight{display:flex;flex-direction:column;align-items:center;gap:14px;padding:8px 0}
.weight .val{font-family:var(--font-display);font-weight:900;font-size:3.4rem;line-height:1}
.weight .val small{font-size:1.2rem;color:var(--muted);margin-left:4px}
.weight .row{display:flex;align-items:center;gap:14px;width:100%}
.step{all:unset;cursor:pointer;flex:none;width:52px;height:52px;border-radius:50%;background:var(--panel);border:2px solid var(--line);display:grid;place-items:center;font-family:var(--font-display);font-weight:900;font-size:1.5rem}
.weight input[type=range]{flex:1;min-width:0;accent-color:var(--green);height:32px}
/* loading */
.loader{display:flex;flex-direction:column;align-items:center;gap:18px;padding-top:12px}
.ring{width:150px;height:150px}
.ring .pct{font-family:var(--font-display);font-weight:900;font-size:30px;fill:var(--ink)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;width:100%}
.steps li{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--muted)}
.steps li .t{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;color:#FFFFFF;font-size:.8rem}
.steps li.done{color:var(--ink)}
.steps li.done .t{background:var(--green);border-color:var(--green)}
/* resultado */
.scores{display:flex;flex-direction:column;gap:12px}
.score .row{display:flex;justify-content:space-between;font-weight:700;font-size:.95rem;gap:10px}
.score .row b{font-family:var(--font-data);font-weight:500}
.score .track{height:12px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}
.score .track i{display:block;height:100%;border-radius:99px;width:0;transition:width 1s ease}
.vs{display:grid;grid-template-columns:1fr 1fr;border:2px solid var(--line);border-radius:16px;overflow:hidden}
.vs .col{display:flex;flex-direction:column;min-width:0}
.vs .hd{padding:12px 10px;text-align:center;font-family:var(--font-display);font-weight:900;font-size:.95rem;text-transform:uppercase;line-height:1.15}
.vs .no .hd{background:var(--red-soft);color:var(--red)}
.vs .yes .hd{background:var(--green);color:#FFFFFF}
.vs .it{padding:10px;font-size:.88rem;line-height:1.3;border-top:1px solid var(--line);display:flex;gap:6px;align-items:flex-start;min-height:62px}
.vs .no .it::before{content:"✕";color:var(--red);font-weight:900}
.vs .yes .it::before{content:"✓";color:var(--green);font-weight:900}
.vs .yes{border-left:2px solid var(--line)}
.day{display:flex;flex-direction:column;border:2px solid var(--green);border-radius:16px;overflow:hidden}
.day .hd{background:var(--green);color:#FFFFFF;padding:10px 14px;font-family:var(--font-display);font-weight:900;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;gap:8px}
.day .hd small{font-family:var(--font-body);font-weight:700;text-transform:none;font-size:.8rem;opacity:.9}
.meal{display:grid;grid-template-columns:44px 1fr;gap:10px;padding:12px 14px;border-top:1px solid var(--line);align-items:start}
.meal:first-of-type{border-top:0}
.meal .ic{font-size:1.5rem;line-height:1;text-align:center}
.meal b{display:block;font-size:.78rem;font-family:var(--font-data);color:var(--green-deep);letter-spacing:.04em;text-transform:uppercase}
.meal .pt{display:inline-block;margin-top:4px;font-size:.75rem;font-weight:800;color:var(--green-deep);background:var(--green-soft);border-radius:99px;padding:2px 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{font-size:.78rem;font-weight:800;border-radius:99px;padding:4px 10px;background:var(--green-soft);color:var(--green-deep)}
.note{border-radius:14px;padding:14px 16px;background:var(--amber-soft);display:flex;flex-direction:column;gap:4px;font-size:.96rem}
.note strong{color:var(--amber)}
.deliv{display:flex;flex-direction:column;gap:10px}
.deliv > div{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:center}
.deliv .ic{width:40px;height:40px;border-radius:10px;background:var(--green-soft);display:grid;place-items:center;font-size:1.25rem}
.deliv b{display:block;line-height:1.2}
.deliv span{font-size:.85rem;color:var(--muted);line-height:1.3}
.offer{border:3px dashed var(--green);border-radius:18px;padding:18px 16px;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
.offer .de{color:var(--red);text-decoration:line-through;font-weight:700}
.offer .por{font-family:var(--font-display);font-weight:900;font-size:3rem;line-height:1;color:var(--green)}
.offer .por small{font-size:1rem;color:var(--ink);font-weight:800;vertical-align:super;margin-right:4px}
.offer .sub{color:var(--muted);font-size:.9rem}
.pay{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.pay span{font-size:.75rem;font-weight:800;border:1.5px solid var(--line);border-radius:6px;padding:3px 8px;color:var(--muted)}
.guarantee{display:flex;gap:12px;align-items:center;text-align:left;font-size:.92rem}
.seal{flex:none;width:64px;height:64px}
.author{display:flex;gap:14px;align-items:center}
.author .ph{flex:none;width:72px;height:72px;border-radius:50%;overflow:hidden;background:var(--green-soft);display:grid;place-items:center;font-family:var(--font-display);font-weight:900;color:var(--green);font-size:1.4rem;border:3px solid var(--green)}
.author .ph img{width:100%;height:100%;object-fit:cover}
.author .reg{font-family:var(--font-data);font-size:.78rem;color:var(--muted)}
.chat{background:#E9E2D8;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.bubble{background:#D9FDD3;align-self:flex-end;color:var(--ink);border-radius:14px 4px 14px 14px;padding:10px 12px;max-width:92%;font-size:.98rem;box-shadow:0 1px 1px rgba(0,0,0,.08)}
.bubble .time{display:block;text-align:right;font-size:.68rem;color:#6B7570;margin-top:2px}
details{border-bottom:1px solid var(--line);padding-block:12px}
details:last-child{border-bottom:0}
summary{cursor:pointer;font-weight:800;list-style:none;display:flex;justify-content:space-between;gap:12px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--green);font-weight:900;font-size:1.2rem;line-height:1}
details[open] summary::after{content:"−"}
details p{margin-top:8px;color:var(--muted)}
.setup{border:2px dashed var(--amber);background:var(--amber-soft);border-radius:14px;padding:12px 14px;font-size:.86rem;display:flex;flex-direction:column;gap:4px;text-align:left}
.setup code{font-family:var(--font-data);font-size:.78rem}
.sticky{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);box-shadow:0 -6px 18px rgba(22,32,28,.08);padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));z-index:5}
.sticky .in{max-width:31rem;margin-inline:auto;display:flex;align-items:center;gap:12px}
.sticky .p{font-family:var(--font-display);font-weight:900;font-size:1.35rem;white-space:nowrap;color:var(--green)}
.sticky .btn{min-height:52px;font-size:1rem}
@media (prefers-reduced-motion: reduce){
  .screen,.pulse{animation:none}
  .progress i,.score .track i{transition:none}
}
</style>
</head>
<body>

<div class="shell">
  <div class="top">
    <div class="bar">
      <button type="button" class="back" id="back" aria-label="Voltar para a pergunta anterior" hidden>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 5l-7 7 7 7" style="stroke:currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="logo" id="logo"></div>
      <span></span>
    </div>
    <div class="progress" id="progress" hidden><i id="progressFill"></i></div>
  </div>
  <main id="screen" class="screen" aria-live="polite"></main>
</div>

<div class="sticky" id="sticky" hidden>
  <div class="in">
    <span class="p" id="stickyPrice"></span>
    <a class="btn" id="stickyCta" href="#">VER MINHAS RECEITAS</a>
  </div>
</div>

<script>
/* =====================================================================
   CONFIGURAÇÃO: troque os valores abaixo antes de colocar no ar
   ===================================================================== */
const CONFIG = {
  marca: {sobre: 'RECEITAS PARA QUEM USA', nome: 'Receita', destaque: 'Caneta'},
  produto: 'Receita Caneta',
  preco: 27.90,
  precoDe: null,            // ex.: 67. Use só se o produto já foi vendido por esse valor.
  checkoutUrl: '',          // seu link de checkout (Kiwify, Hotmart, Payt...). UTMs e fbclid vão junto.
  backendUrl: '',           // https://SEU_PROJETO.supabase.co/functions/v1/quiz  (veja backend/README.md)
  pixelId: '',              // ID do Pixel do Meta. Só carrega no seu domínio.
  garantiaDias: 7,
  provaSocial: '',          // ex.: 'Mais de 3.200 pessoas já fizeram o teste'. Só com número real.
  // Quebra de objeção da idade (tela logo depois da idade). Preencha só com números reais da sua base.
  // Ex.: i40: {pct: 40, texto: 'das nossas alunas de 40 a 49 anos disseram que a barriga começou a diminuir na 3ª semana de receitas'}
  provaIdade: {i18: null, i30: null, i40: null, i50: null, i60: null},
  autor: {                  // quem montou as receitas. Deixe nome vazio para esconder o bloco.
    nome: '',
    registro: '',           // ex.: 'CRN-3 00000'
    foto: '',
    bio: ''
  },
  depoimentos: [
    // Só depoimentos reais, com autorização. Formato:
    // { nome: 'Carla, 44 anos', texto: 'O sorvete de chocolate salvou minhas noites...' }
  ],
  entregaveis: [
    ['🧊', 'Receitas geladas e líquidas', 'Shakes, sorvetes, picolés e smoothies com proteína, para quando só desce coisa gelada.'],
    ['🍫', 'Doces que matam a vontade', 'Mousses, brigadeiros e bolos de caneca com proteína e pouco açúcar.'],
    ['🍔', 'Fast-food de casa', 'Hambúrguer, pizza e salgado em versão caseira, com porção do tamanho do seu apetite.'],
    ['🥣', 'Mini-refeições para dias sem fome', 'Porções pequenas que fecham a proteína mesmo quando você quase não come.'],
    ['🍽️', 'Guia do prato com a caneta', 'O que comer primeiro, quanto e como evitar o enjoo.'],
    ['🛒', 'Lista de compras', 'Tudo separado por semana, para ir ao mercado uma vez.']
  ],
  bonus: []
};

/* ===================================================================== */
const SETUP = !CONFIG.checkoutUrl;
const VERSAO = 'v1';
const fmtBRL = (v) => new Intl.NumberFormat('pt-BR', {style: 'currency', currency: 'BRL'}).format(v);
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') n.className = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? '' : v);
  }
  kids.flat().forEach((c) => { if (c != null && c !== false) n.append(c.nodeType ? c : document.createTextNode(c)); });
  return n;
};
const H = (tag, html, cls) => el(tag, {class: cls, html});
const norm = (o) => (typeof o === 'string' ? {v: o, l: o} : o);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const reduceMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

const pageParams = (() => { try { return new URLSearchParams(location.search); } catch (e) { return new URLSearchParams(); } })();
const UTM_KEYS = ['utm_source', 'utm_medium', 'utm_campaign', 'utm_content', 'utm_term', 'utm_id', 'fbclid'];

    wrap.querySelectorAll('.opt').forEach((x) => x.setAttribute('aria-pressed', String(sel.has(x.dataset.v))));
    cont.setAttribute('aria-disabled', String(sel.size === 0));
  };
  opts.forEach((o) => {
    const b = el('button', {type: 'button', class: 'opt', id: `opt-${s.id}-${o.v}`, 'data-v': o.v},

    b.addEventListener('click', () => {

        else opts.filter((x) => x.exclusive).forEach((x) => sel.delete(x.v));
        sel.add(o.v);
      }
      state.a[s.id] = [...sel];
      sync();

    el('div', {class: 'panel'},
      H('p', '✓ Porções pequenas, do tamanho do apetite da caneta<br>✓ Proteína primeiro, para o corpo queimar gordura e não músculo<br>✓ Gelado, doce e lanche continuam no cardápio')),
    el('button', {type: 'button', class: 'btn', id: 'cont-solucao', onclick: next}, 'Quero ver como fica pra mim ➜')
  ];
};

const renderLoading = () => {
  const items = ['Analisando as suas respostas', 'Calculando a sua proteína do dia', 'Separando receitas geladas e doces', 'Montando o seu Dia 1'];
  const ul = el('ul', {class: 'steps'}, items.map((t) => el('li', {}, el('span', {class: 't', 'aria-hidden': 'true'}, '✓'), t)));
  const C = 2 * Math.PI * 62;
  const ring = el('div', {html: `<svg class="ring" viewBox="0 0 150 150" role="img" aria-label="Montando o seu plano"><circle cx="75" cy="75" r="62" style="fill:none;stroke:#E2E7E3" stroke-width="12"/><circle id="arc" cx="75" cy="75" r="62" style="fill:none;stroke:#1E9E45" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}" transform="rotate(-90 75 75)"/><text id="pct" class="pct" x="75" y="86" text-anchor="middle">0%</text></svg>`});
  const total = reduceMotion ? 1200 : 4200;
  const t0 = performance.now();
  const tick = (now) => {
    if (STEPS[state.i].type !== 'loading') return;
    const p = Math.min(1, (now - t0) / total);
    const v = Math.min(100, Math.round((p < 0.75 ? p * 1.05 : 0.7875 + (p - 0.75) * 0.85) * 100));
    const arc = ring.querySelector('#arc');
    const pct = ring.querySelector('#pct');
    if (arc) arc.setAttribute('stroke-dashoffset', String(C * (1 - v / 100)));
    if (pct) pct.textContent = v + '%';
    [...ul.children].forEach((li, k) => li.classList.toggle('done', v >= (k + 1) * 24));
    if (p < 1) requestAnimationFrame(tick);
    else setTimeout(() => {
      if (STEPS[state.i].type !== 'loading') return;
      send('concluido', {etapa: QUESTION_IDX.length + 1, perfil: perfilId()});
      track('QuizCompleto', {}, true);
      next();
    }, 450);
  };
  requestAnimationFrame(tick);
  return [H('h2', 'Montando o seu <span class="g">plano de receitas</span>'), el('p', {class: 'hint'}, 'Estamos cruzando as suas respostas.'), el('div', {class: 'loader'}, ring, ul)];
};

/* ---------- Resultado ---------- */
const PERFIS = {
  economia: {nome: 'Apetite no modo economia', txt: 'A caneta tirou a fome e você passa o dia beliscando. O corpo emagrece, mas parte do que sai é músculo, e por isso vem o cansaço e a pochete não sai. Seu plano começa com mini-refeições que fecham a proteína em poucas garfadas.'},
  gelado: {nome: 'Só desce gelado', txt: 'Com a caneta, o corpo pede coisas frias e leves. O problema é que os gelados comuns quase não têm proteína. Seu plano troca o sorvete e o açaí por versões cremosas que alimentam de verdade.'},
  doce: {nome: 'Doce no lugar da comida', txt: 'Com a fome baixa, o doce entra fácil e ocupa o espaço da comida. Seu plano mantém o doce todos os dias, só que em receitas com proteína que seguram a vontade.'},
  lanche: {nome: 'Fome de hambúrguer', txt: 'A vontade de lanche continua mesmo com a caneta. Em vez de lutar contra ela, seu plano traz hambúrguer, pizza e salgado caseiros, no tamanho do seu apetite e com a proteína que o corpo precisa.'},
  prato_pequeno: {nome: 'Prato encolhido', txt: 'Você come comida de verdade, só que bem menos, e a parte que sobra no prato costuma ser a proteína. Seu plano muda a ordem e a proporção do prato para cada garfada contar.'}
};
const perfilId = () => (PERFIS[state.a.come] ? state.a.come : 'gelado');

const renderResult = () => {
  const a = state.a;
  const s = sint();
  const perfil = PERFIS[perfilId()];
  const [min, max] = protMeta();
  const porRefeicao = Math.round(min / 4);
  const out = [];

  out.push(el('span', {class: 'badge'}, 'Seu resultado está pronto'));
  out.push(H('h1', `Seu perfil: <span class="g">${perfil.nome}</span>`));
  out.push(el('p', {class: 'lead'}, perfil.txt));

  const musculo = clamp(30 + (s.includes('fome') ? 18 : 0) + ({economia: 22, doce: 18, gelado: 16, prato_pequeno: 10, lanche: 6}[a.come] || 10)
    + (['i40', 'i50', 'i60'].includes(a.idade) ? 10 : 0) + (s.includes('cansaco') ? 6 : 0) + (s.includes('academia') ? 6 : 0), 20, 94);
  const vontade = clamp(20 + (s.includes('doce') ? 28 : 0) + (s.includes('gelado') ? 20 : 0) + (s.includes('lanche') ? 18 : 0) + (['doce', 'gelado', 'lanche'].includes(a.come) ? 14 : 0), 12, 95);
  const energia = clamp(78 - (s.includes('cansaco') ? 26 : 0) - (s.includes('academia') ? 14 : 0) - (s.includes('fome') ? 10 : 0), 18, 90);
  const destravar = clamp(62 + (a.compromisso === 'sim' ? 22 : 10) + (a.tempo === 't5' ? 6 : 4) + (a.pochete === 'travou' ? 4 : 0), 40, 96);
  const scoreRow = (lbl, v, color, id) => el('div', {class: 'score'},
    el('div', {class: 'row'}, el('span', {}, lbl), el('b', {}, v + '%')),
    el('div', {class: 'track'}, el('i', {id, 'data-w': v, style: `background:${color}`})));
  out.push(el('div', {class: 'panel'},
    H('h3', 'Análise das suas respostas 👇'),
    el('div', {class: 'scores'},
      scoreRow('Risco de perder músculo junto com a gordura', musculo, '#D7342A', 'sc1'),
      scoreRow('Força da vontade de doce, gelado ou lanche', vontade, '#C97800', 'sc2'),
      scoreRow('Energia no dia a dia', energia, '#C97800', 'sc3'),
      scoreRow('Chance de destravar a barriga com o prato certo', destravar, '#1E9E45', 'sc4')),
    el('p', {class: 'fine'}, 'Pontuação do teste, calculada pelas suas respostas. Não é diagnóstico.')));

  out.push(el('div', {class: 'panel white'},
    H('h3', `Sua meta: <span class="g">${min} a ${max} g de proteína por dia</span>`),
    el('p', {}, `Dividido em 4 momentos, dá cerca de ${porRefeicao} g por vez. Parece muito para quem quase não sente fome, e é por isso que as receitas são pensadas para caber em poucas garfadas.`)));

  const vsNo = ['Come pouco e a proteína não fecha', 'Doce e gelado sem nada de proteína', 'Cansaço e zero pique para treinar', 'A pochete continua lá'];
  const vsYes = ['Porção pequena que alimenta', 'Gelado e doce que seguram a vontade', 'Mais energia ao longo do dia', 'O corpo queima gordura, não músculo'];
  out.push(el('div', {class: 'vs'},
    el('div', {class: 'col no'}, el('div', {class: 'hd'}, 'Como está hoje'), vsNo.map((t) => el('div', {class: 'it'}, t))),
    el('div', {class: 'col yes'}, el('div', {class: 'hd'}, 'Com as receitas certas'), vsYes.map((t) => el('div', {class: 'it'}, t)))));

  const rapido = a.tempo === 't5';
  const meals = [
    ['☕', 'Café da manhã', s.includes('enjoo') || a.come === 'economia' ? 'Shake gelado de café com leite e proteína. Desce fácil mesmo sem fome.' : 'Ovos mexidos cremosos com queijo + café. Pronto em 5 minutos.', 22],
    ['🍽️', 'Almoço', a.come === 'lanche' ? 'Hambúrguer caseiro no prato com salada e batata rústica, porção pequena.' : (rapido ? 'Frango desfiado pronto da geladeira com legumes e 2 colheres de arroz.' : 'Prato pequeno: carne ou frango primeiro, depois legumes e 2 colheres de arroz.'), 30],
    [s.includes('gelado') || a.come === 'gelado' ? '🍦' : '🍫', 'Lanche da tarde', s.includes('gelado') || a.come === 'gelado' ? 'Sorvete cremoso de chocolate proteico (3 ingredientes, no liquidificador).' : 'Mousse de chocolate com proteína para a hora da vontade de doce.', 18],
    ['🍲', 'Jantar', s.includes('enjoo') ? 'Caldo leve de frango com legumes, em porção pequena.' : (a.come === 'lanche' ? 'Pizza de frigideira com massa de frango.' : 'Omelete recheada com legumes e queijo.'), 25]
  ];
  const chips = [];
  if (rapido) chips.push('Até 5 minutos');
  if (s.includes('gelado') || a.come === 'gelado') chips.push('Opções geladas');
  if (s.includes('doce') || a.come === 'doce') chips.push('Doce todo dia');
  if (s.includes('enjoo')) chips.push('Leve para o enjoo');
  out.push(H('h2', 'Veja como fica o <span class="g">seu Dia 1</span>'));
  if (chips.length) out.push(el('div', {class: 'chips'}, chips.map((c) => el('span', {class: 'chip'}, '✓ ' + c))));
  const day = el('div', {class: 'day', id: 'dia1'},
    el('div', {class: 'hd'}, 'Dia 1', el('small', {}, 'montado pelas suas respostas')),
    meals.map(([ic, t, d, g]) => el('div', {class: 'meal'}, el('span', {class: 'ic', 'aria-hidden': 'true'}, ic), el('div', {}, el('b', {}, t), d, el('br'), el('span', {class: 'pt'}, `~${g} g de proteína`)))));
  out.push(day);
  out.push(el('p', {class: 'fine'}, `Total aproximado do Dia 1: ~${meals.reduce((t, m) => t + m[3], 0)} g de proteína. As receitas completas, com quantidades e variações, ficam no material.`));

  out.push(el('div', {class: 'note', role: 'note'},
    el('strong', {}, 'A caneta continua do jeito que o seu médico passou.'),
    el('span', {}, 'As receitas cuidam do prato. Dose, troca de medicamento e efeitos colaterais fortes são sempre com o seu médico.')));

  out.push(el('div', {class: 'panel'},
    H('h3', `O que vem no <span class="g">${CONFIG.produto}</span>`),
    el('div', {class: 'deliv'}, CONFIG.entregaveis.map(([ic, t, d]) => el('div', {}, el('span', {class: 'ic', 'aria-hidden': 'true'}, ic), el('div', {}, el('b', {}, t), el('span', {}, d))))),
    CONFIG.bonus.length ? el('div', {class: 'deliv'}, H('h3', '🎁 Bônus'), CONFIG.bonus.map((b) => el('div', {}, el('span', {class: 'ic', 'aria-hidden': 'true'}, '🎁'), el('div', {}, el('b', {}, b))))) : null));

  const href = checkoutHref();
  const setupMsg = el('div', {class: 'setup', role: 'note', hidden: SETUP ? null : true},
    el('strong', {}, 'Falta configurar o checkout'),
    H('span', 'Coloque o seu link em <code>CONFIG.checkoutUrl</code> no topo do arquivo. Enquanto isso, o botão não leva a lugar nenhum.'));
  const onBuy = (ev) => {
    ev.preventDefault();
    if (!CONFIG.checkoutUrl) { setupMsg.hidden = false; setupMsg.scrollIntoView({behavior: 'smooth', block: 'center'}); return; }
    send('checkout', {etapa: QUESTION_IDX.length + 2});
    track('InitiateCheckout', {value: CONFIG.preco, currency: 'BRL'});
    setTimeout(() => { location.href = href; }, 250);
  };
  const [reais, cents] = CONFIG.preco.toFixed(2).split('.');
  out.push(el('div', {class: 'offer', id: 'oferta'},
    H('h2', 'Seu plano de receitas <span class="g">está pronto</span>'),
    el('p', {}, `Receitas para o perfil ${perfil.nome}, com as opções que você marcou.`),
    CONFIG.precoDe ? el('span', {class: 'de'}, `De ${fmtBRL(CONFIG.precoDe)}`) : null,
    H('span', `<small>R$</small>${reais},${cents}`, 'por'),
    el('span', {class: 'sub'}, 'Pagamento único · acesso imediato no seu e-mail'),
    el('a', {class: 'btn big pulse', id: 'cta', href, onclick: onBuy}, 'Quero minhas receitas ✅'),
    el('div', {class: 'pay', 'aria-label': 'Formas de pagamento'}, el('span', {}, 'PIX'), el('span', {}, 'CARTÃO'), el('span', {}, 'COMPRA SEGURA')),
    el('div', {class: 'guarantee'}, H('span', sealSvg(CONFIG.garantiaDias)), el('span', {}, el('b', {}, `Garantia de ${CONFIG.garantiaDias} dias. `), 'Se não gostar, devolvemos 100% do valor.')),
    setupMsg));

  const au = CONFIG.autor;
  if (au.nome) {
    const ph = el('div', {class: 'ph'});
    if (au.foto) ph.append(el('img', {src: au.foto, alt: au.nome})); else ph.textContent = au.nome.split(' ').map((w) => w[0]).slice(0, 2).join('');
    out.push(el('div', {class: 'panel'},
      el('span', {class: 'badge'}, 'Quem montou as receitas'),
      el('div', {class: 'author'}, ph, el('div', {}, el('b', {}, au.nome), au.registro ? el('div', {class: 'reg'}, au.registro) : null)),
      au.bio ? el('p', {}, au.bio) : null));
  }

  if (CONFIG.depoimentos.length) {
    out.push(H('h2', 'Quem já está <span class="g">usando as receitas</span>'));
    out.push(el('div', {class: 'chat'}, CONFIG.depoimentos.map((d) => el('div', {class: 'bubble'}, d.texto, el('span', {class: 'time'}, d.nome)))));
  } else if (SETUP) {
    out.push(el('div', {class: 'setup', role: 'note'}, el('strong', {}, 'Espaço para depoimentos'), H('span', 'Adicione depoimentos reais, com autorização, em <code>CONFIG.depoimentos</code>. Sem depoimentos, esta parte some.')));
  }

  const faq = [
    ['Serve para qualquer caneta?', 'Sim. As receitas cuidam do prato e servem para quem usa Mounjaro, Ozempic, Wegovy, Saxenda ou outra, e também para quem parou e quer manter o resultado.'],
    ['E se eu quase não sinto fome?', 'É exatamente para isso: porções pequenas, muitas delas geladas ou líquidas, que fecham a proteína em poucas garfadas.'],
    ['Preciso comprar whey ou suplemento?', 'Não é obrigatório. Várias receitas usam ovos, frango, iogurte e queijo. Onde o whey entra, tem a versão sem ele.'],
    ['Preciso mudar a dose da caneta?', 'Não. Nada aqui mexe no seu tratamento. Dose e medicamento são sempre com o seu médico.'],
    ['Como eu recebo?', 'Logo depois do pagamento, o acesso chega no seu e-mail. Dá para ver no celular ou imprimir.'],
    ['E se eu não gostar?', `Você tem ${CONFIG.garantiaDias} dias de garantia. É só pedir o reembolso e devolvemos 100% do valor.`]
  ];
  out.push(el('div', {class: 'panel white'}, H('h3', 'Perguntas frequentes'), faq.map(([q, r]) => el('details', {}, el('summary', {}, q), el('p', {}, r)))));
  out.push(el('a', {class: 'btn big', id: 'cta-2', href, onclick: onBuy}, 'Quero minhas receitas ✅'));
  out.push(el('p', {class: 'fine'}, 'Material educativo. Não substitui consulta médica ou com nutricionista. Os resultados variam de pessoa para pessoa.'));

  $('#stickyPrice').textContent = fmtBRL(CONFIG.preco);
  const sc = $('#stickyCta');
  sc.href = href;
  sc.onclick = onBuy;
  // A barra fixa de compra só aparece depois que a pessoa viu o Dia 1: primeiro o valor, depois o preço.
  sticky.hidden = true;
  if ('IntersectionObserver' in window) {
    const io = new IntersectionObserver((entries) => {
      if (entries.some((e) => e.isIntersecting || e.boundingClientRect.top < 0)) { sticky.hidden = STEPS[state.i].type !== 'result'; io.disconnect(); }
    });
    setTimeout(() => io.observe(day), 0);
  } else {
    sticky.hidden = false;
  }
  track('ViewContent', {value: CONFIG.preco, currency: 'BRL'});
  setTimeout(() => { ['sc1', 'sc2', 'sc3', 'sc4'].forEach((id) => { const b = document.getElementById(id); if (b) b.style.width = b.dataset.w + '%'; }); }, reduceMotion ? 0 : 120);
  return out;
};

/* ---------- Render ---------- */
const RENDER = {intro: renderIntro, age: renderAge, buttons: renderButtons, multi: renderMulti, insight: renderInsight,
  weight: renderWeight, mirror: renderMirror, solution: renderSolution, loading: renderLoading, result: renderResult};
const render = () => {
  const s = STEPS[state.i];
  const qi = QUESTION_IDX.indexOf(state.i);
  back.hidden = state.i === 0 || s.type === 'loading';
  progress.hidden = state.i === 0 || s.type === 'result';
  progressFill.style.width = (s.type === 'loading' ? 100 : Math.round(((qi + 1) / (QUESTION_IDX.length + 1)) * 100)) + '%';
  if (s.type !== 'result') sticky.hidden = true;
  screen.replaceChildren(...RENDER[s.type](s).filter(Boolean));
  screen.style.animation = 'none';
  void screen.offsetWidth;
  screen.style.animation = '';
  const first = screen.querySelector('h1,h2');
  if (first && state.i > 0) { first.setAttribute('tabindex', '-1'); try { first.focus({preventScroll: true}); } catch (e) {} }
};
render();
</script>
</body>
</html>
