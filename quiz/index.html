<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#17332B">
<title>Teste da Caneta · além da caneta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap">
<style>
/* Identidade "além da caneta": Creme/Linho de base, Floresta/Sálvia/Musgo de apoio, Argila só como acento.
   Instrument Serif nos títulos (itálico só na palavra-chave) e Instrument Sans no resto. Tema claro único, de propósito. */
:root{
  color-scheme:light;
  --floresta:#17332B;
  --creme:#F4F0E8;
  --linho:#E4DDCF;
  --salvia:#B7C4B1;
  --salvia-soft:#E8ECE3;
  --musgo:#4A5E52;
  --argila:#B8744F;          /* traços e preenchimentos */
  --argila-ink:#9A5A39;      /* texto argila sobre creme/branco (4,7:1) */
  --argila-cta:#A65E3A;      /* fundo do botão de compra (4,8:1 com branco) */
  --argila-dark:#7F4A2E;
  --argila-on-dark:#D9A07E;  /* texto argila sobre floresta (6:1) */
  --argila-soft:#F3E6DC;
  --branco:#FFFDF9;
  --on-dark-muted:#A9B8AC;
  --line:#DCD4C4;
  --line-soft:#ECE6DA;
  --danger:#A4442C;
  --serif:"Instrument Serif",Georgia,"Times New Roman",serif;
  --sans:"Instrument Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --shadow:0 1px 2px rgba(23,51,43,.06),0 4px 14px rgba(23,51,43,.05);
  --shadow-lift:0 2px 4px rgba(23,51,43,.08),0 10px 24px rgba(23,51,43,.08);
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--creme);color:var(--floresta);font-family:var(--sans);font-size:1rem;line-height:1.5;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;padding-top:env(safe-area-inset-top,0px)}
::selection{background:var(--salvia);color:var(--floresta)}
[hidden]{display:none!important}
img{max-width:100%}
svg{display:block}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.shell{max-width:30rem;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}

/* topo: marca, voltar, contador e a linha argila como progresso */
.top{position:sticky;top:0;z-index:4;background:var(--creme);padding-top:6px;padding-bottom:10px;margin-bottom:6px}
.bar{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;min-height:48px}
.back{all:unset;cursor:pointer;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--musgo);transition:background .2s}
.back:hover{background:var(--linho);color:var(--floresta)}
.logo{grid-column:2;justify-self:center;display:flex;align-items:center;gap:8px;color:var(--floresta);line-height:1}
.logo .mark{width:40px;height:18px}
.logo .word{font-family:var(--serif);font-size:1.375rem;letter-spacing:-.005em;white-space:nowrap}
.logo .word i{font-style:italic}
.count{justify-self:end;font-size:.8125rem;font-weight:600;color:var(--musgo);font-variant-numeric:tabular-nums;white-space:nowrap}
.progress{position:relative;height:16px;display:flex;align-items:center}
.progress .track{position:absolute;left:0;right:0;height:3px;border-radius:3px;background:var(--line)}
.progress .fill{position:absolute;left:0;height:3px;border-radius:3px;background:var(--argila);width:0;transition:width .6s var(--ease)}
.progress .cap{position:absolute;top:2px;width:24px;height:12px;left:0;transition:left .6s var(--ease)}

.screen{display:flex;flex-direction:column;gap:18px;animation:in .45s var(--ease) both}
@keyframes in{from{opacity:.001;transform:translateY(12px)}to{opacity:1;transform:none}}

/* tipografia */
h1,h2,h3{margin:0;font-weight:400;text-wrap:balance}
h1{font-family:var(--serif);font-size:clamp(2.25rem,10vw,2.875rem);line-height:1.02;letter-spacing:-.015em}
h2{font-family:var(--serif);font-size:clamp(1.875rem,8.2vw,2.25rem);line-height:1.06;letter-spacing:-.01em;text-align:center}
h3{font-family:var(--sans);font-weight:600;font-size:1.0625rem;line-height:1.3}
h1 em,h2 em,h3 em{font-family:var(--serif);font-style:italic;color:var(--argila-ink)}
h3 em{font-size:1.15em;font-weight:400}
p{margin:0;text-wrap:pretty}
b,strong{font-weight:600}
.c{text-align:center}
.lead{color:var(--musgo);text-align:center;font-size:1.0625rem}
.hint{color:var(--musgo);font-size:.9375rem;text-align:center;margin-top:-8px}
.fine{font-size:.8125rem;color:var(--musgo);text-align:center;line-height:1.45}
.src{font-size:.75rem;color:var(--musgo);line-height:1.4}
.num{font-variant-numeric:tabular-nums}

/* botões */
.btn{all:unset;box-sizing:border-box;cursor:pointer;width:100%;min-height:58px;padding:15px 22px;border-radius:999px;background:var(--floresta);color:var(--creme);font-family:var(--sans);font-weight:600;font-size:1.0625rem;text-align:center;display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;line-height:1.25;box-shadow:0 2px 0 rgba(0,0,0,.18),0 10px 22px rgba(23,51,43,.18);transition:transform .15s var(--ease),box-shadow .15s,opacity .2s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(1px);box-shadow:0 1px 0 rgba(0,0,0,.18),0 4px 10px rgba(23,51,43,.18)}
.btn .ic{width:20px;height:20px}
.btn.stick{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:3}
.btn[aria-disabled="true"]{opacity:.38;cursor:not-allowed;transform:none}
.btn.buy{background:var(--argila-cta);color:var(--branco);min-height:64px;font-size:1.125rem;font-weight:700;box-shadow:0 3px 0 var(--argila-dark),0 12px 26px rgba(166,94,58,.32)}
.btn.buy:active{box-shadow:0 1px 0 var(--argila-dark),0 4px 10px rgba(166,94,58,.3)}
.pulse{animation:pulse 2.2s var(--ease) infinite}
@keyframes pulse{0%,100%{box-shadow:0 3px 0 var(--argila-dark),0 12px 26px rgba(166,94,58,.32),0 0 0 0 rgba(184,116,79,.45)}60%{box-shadow:0 3px 0 var(--argila-dark),0 12px 26px rgba(166,94,58,.32),0 0 0 12px rgba(184,116,79,0)}}

/* opções */
.opts{display:flex;flex-direction:column;gap:10px}
.opt{all:unset;box-sizing:border-box;cursor:pointer;width:100%;min-height:66px;padding:11px 14px 11px 11px;border:1.5px solid var(--line-soft);border-radius:18px;background:var(--branco);display:flex;align-items:center;gap:13px;font-weight:500;font-size:1rem;line-height:1.3;box-shadow:var(--shadow);transition:border-color .2s,background .2s,transform .15s var(--ease)}
.opt:hover{border-color:var(--salvia)}
.opt:active{transform:scale(.985)}
.opt .tile{flex:none;width:44px;height:44px;border-radius:13px;background:var(--creme);display:grid;place-items:center;color:var(--floresta);transition:background .2s,color .2s}
.opt .lbl{flex:1}
.opt .mark{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;transition:background .2s,border-color .2s}
.opt.sq .mark{border-radius:7px}
.opt .mark svg{width:12px;height:12px;stroke:var(--branco);stroke-width:3;fill:none;opacity:0;transform:scale(.4);transition:opacity .2s,transform .3s var(--ease)}
.opt[aria-pressed="true"]{border-color:var(--floresta);background:var(--salvia-soft)}
.opt[aria-pressed="true"] .tile{background:var(--floresta);color:var(--creme)}
.opt[aria-pressed="true"] .mark{background:var(--floresta);border-color:var(--floresta)}
.opt[aria-pressed="true"] .mark svg{opacity:1;transform:none}
.opt.plain{min-height:56px;padding-left:16px}
.btn:focus-visible,.opt:focus-visible,.age:focus-visible,.back:focus-visible,summary:focus-visible,.step:focus-visible,input[type=range]:focus-visible{outline:2.5px solid var(--argila);outline-offset:3px}

/* abertura */
.hero{background:var(--floresta);color:var(--creme);border-radius:28px;padding:26px 22px 24px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.hero h1{color:var(--creme)}
.hero h1 em{color:var(--argila-on-dark)}
.hero p{color:var(--on-dark-muted);font-size:1.0625rem}
.hero p b{color:var(--creme)}
.hero .curve{position:absolute;right:-8px;top:18px;width:150px;height:80px;opacity:.9}
.hero .tags{display:flex;flex-wrap:wrap;gap:6px}
.hero .tags span{font-size:.8125rem;font-weight:500;border-radius:999px;padding:5px 11px;background:rgba(244,240,232,.1);color:var(--creme);border:1px solid rgba(244,240,232,.16)}
.ask{font-family:var(--serif);font-size:1.75rem;line-height:1.1;text-align:center;margin-top:4px}
.ask em{font-style:italic;color:var(--argila-ink)}
.ages{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.age{all:unset;box-sizing:border-box;cursor:pointer;background:var(--branco);border:1.5px solid var(--line-soft);border-radius:20px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow);transition:border-color .2s,background .2s,transform .15s var(--ease)}
.age:hover{border-color:var(--salvia)}
.age:active{transform:scale(.98)}
.age .n{font-family:var(--serif);font-size:2rem;line-height:1;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.age .row{display:flex;align-items:center;justify-content:space-between;color:var(--musgo);font-size:.875rem;font-weight:500}
.age .go{width:28px;height:28px;border-radius:50%;background:var(--creme);display:grid;place-items:center;color:var(--floresta);transition:background .2s,color .2s}
.age .go .ic{width:16px;height:16px}
.age[aria-pressed="true"]{border-color:var(--floresta);background:var(--salvia-soft)}
.age[aria-pressed="true"] .go{background:var(--floresta);color:var(--creme)}
.age:last-child:nth-child(odd){grid-column:1/-1;flex-direction:row;align-items:center;justify-content:space-between}
.age:last-child:nth-child(odd) .row{gap:12px}
.trust{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;color:var(--musgo);font-size:.8125rem;font-weight:500}
.trust span{display:flex;align-items:center;gap:5px}
.trust .ic{width:15px;height:15px}

/* folhas (telas de explicação) */
.sheet{background:var(--branco);border-radius:24px;padding:20px 18px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.sheet.dark{background:var(--floresta);color:var(--creme)}
.sheet.dark .src,.sheet.dark .fine{color:var(--on-dark-muted)}
.sheet.dark h3 em{color:var(--argila-on-dark)}
.sheet.linho{background:var(--linho);box-shadow:none}
.stamp{align-self:center;display:inline-flex;align-items:center;gap:7px;font-size:.875rem;font-weight:600;color:var(--floresta);background:var(--salvia-soft);border-radius:999px;padding:7px 14px 7px 10px}
.stamp .ic{width:17px;height:17px;color:var(--argila-ink)}
.stat{display:flex;align-items:baseline;gap:12px}
.stat b{font-family:var(--serif);font-weight:400;font-size:3.25rem;line-height:.9;color:var(--argila-on-dark);white-space:nowrap;letter-spacing:-.02em}
.stat span{font-size:.9375rem;line-height:1.35}
.chart{width:100%;height:auto}
.chart text{font-family:var(--sans);font-size:11px;font-weight:500}
.split{display:flex;height:54px;border-radius:14px;overflow:hidden;font-weight:600;font-size:.875rem}
.split div{display:flex;flex-direction:column;justify-content:center;padding:0 12px;line-height:1.15}
.split div small{font-weight:500;font-size:.75rem;opacity:.85}
.split .fat{background:var(--salvia);color:var(--floresta)}
.split .lean{background:var(--argila-cta);color:var(--branco)}
.legend{display:flex;gap:14px;font-size:.8125rem;color:var(--musgo)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:block}

.mirror{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.mirror li{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:start;padding:12px 0;border-top:1px solid var(--line-soft)}
.mirror li:first-child{border-top:0;padding-top:0}
.mirror li:last-child{padding-bottom:0}
.mirror .tile{width:40px;height:40px;border-radius:12px;background:var(--argila-soft);color:var(--argila-ink);display:grid;place-items:center}
.mirror b{display:block;line-height:1.3}
.mirror span{font-size:.9rem;color:var(--musgo);line-height:1.4}
.gauge{display:flex;flex-direction:column;gap:7px}
.gauge .row{display:flex;justify-content:space-between;align-items:baseline;font-size:.9rem;gap:10px}
.gauge .row b{font-variant-numeric:tabular-nums}
.gauge .track{height:12px;border-radius:99px;background:var(--line-soft);overflow:hidden}
.gauge .track i{display:block;height:100%;border-radius:99px;width:0;transition:width 1.1s var(--ease)}

.swap{display:grid;grid-template-columns:1fr 34px 1fr;align-items:stretch;gap:0}
.swap .card{border-radius:20px;padding:16px 12px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px}
.swap .no{background:var(--linho)}
.swap .yes{background:var(--floresta);color:var(--creme)}
.swap .tile{width:52px;height:52px;border-radius:16px;display:grid;place-items:center}
.swap .no .tile{background:var(--creme);color:var(--musgo)}
.swap .yes .tile{background:rgba(244,240,232,.1);color:var(--argila-on-dark)}
.swap .tile .ic{width:28px;height:28px}
.swap .name{font-size:.875rem;font-weight:500;line-height:1.3;min-height:3.4em}
.swap .g{font-family:var(--serif);font-size:2.25rem;line-height:1;font-variant-numeric:tabular-nums}
.swap .no .g{color:var(--musgo)}
.swap .yes .g{color:var(--argila-on-dark)}
.swap small{font-size:.75rem;opacity:.8}
.swap .arrow{display:grid;place-items:center;color:var(--argila)}
.swap .arrow .ic{width:20px;height:20px}
.rules{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.rules li{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:start}
.rules .n{width:30px;height:30px;border-radius:50%;background:var(--floresta);color:var(--creme);display:grid;place-items:center;font-family:var(--serif);font-size:1.125rem;line-height:1}
.rules b{display:block}
.rules span{font-size:.9rem;color:var(--musgo)}

/* peso */
.measures{display:flex;flex-direction:column;gap:10px}
.weight{display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px 16px 12px;background:var(--branco);border-radius:24px;box-shadow:var(--shadow)}
.weight .lbl{align-self:flex-start;font-size:.8125rem;font-weight:600;color:var(--musgo);margin-bottom:-14px}
.weight .val{font-family:var(--serif);font-size:3.25rem;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.weight .val small{font-family:var(--sans);font-size:1.125rem;color:var(--musgo);margin-left:6px;letter-spacing:0}
.weight .row{display:flex;align-items:center;gap:12px;width:100%}
.step{all:unset;cursor:pointer;flex:none;width:52px;height:52px;border-radius:50%;background:var(--creme);display:grid;place-items:center;color:var(--floresta);transition:background .2s}
.step:hover{background:var(--linho)}
.step .ic{width:22px;height:22px}
input[type=range]{flex:1;min-width:0;height:36px;accent-color:var(--floresta);background:transparent}
.ruler{display:flex;justify-content:space-between;width:100%;padding:0 64px;font-size:.75rem;color:var(--musgo);font-variant-numeric:tabular-nums;margin-top:-8px}
.imc-live{align-self:center;display:flex;align-items:baseline;gap:8px;background:var(--floresta);color:var(--creme);border-radius:999px;padding:8px 16px;font-size:.875rem}
.imc-live b{font-family:var(--serif);font-weight:400;font-size:1.375rem;line-height:1;color:var(--argila-on-dark);font-variant-numeric:tabular-nums}
.imc-live span{color:var(--on-dark-muted)}
.bmi{display:flex;flex-direction:column;gap:8px}
.bmi .bhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.bmi .bhead b{font-family:var(--serif);font-weight:400;font-size:2.5rem;line-height:1;font-variant-numeric:tabular-nums}
.bmi .bhead small{font-family:var(--sans);font-size:.875rem;font-weight:600;color:var(--musgo);margin-right:6px}
.bmi .bhead span{font-size:.9375rem;font-weight:600;text-align:right}
.bmi .scale{position:relative;padding-top:12px}
.bmi .bands{display:flex;height:10px;border-radius:99px;overflow:hidden;gap:2px}
.bmi .bands i{display:block;height:100%}
.bmi .pin{position:absolute;top:0;width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-top:9px solid var(--floresta);margin-left:-7px}
.bmi .ticks{position:relative;height:16px;font-size:.72rem;color:var(--musgo);font-variant-numeric:tabular-nums}
.bmi .ticks span{position:absolute;transform:translateX(-50%)}

/* carregamento */
.loader{display:flex;flex-direction:column;align-items:center;gap:22px;padding-top:6px}
.loader .big{width:200px;height:92px}
.loader .pct{font-family:var(--serif);font-size:3.5rem;line-height:1;font-variant-numeric:tabular-nums;margin-top:-6px}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;width:100%;background:var(--branco);border-radius:22px;padding:18px;box-shadow:var(--shadow)}
.checks li{display:flex;align-items:center;gap:12px;font-weight:500;color:var(--musgo);transition:color .3s}
.checks .t{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);flex:none;display:grid;place-items:center;transition:background .3s,border-color .3s}
.checks .t svg{width:12px;height:12px;stroke:var(--branco);stroke-width:3;fill:none;opacity:0;transition:opacity .3s}
.checks li.done{color:var(--floresta)}
.checks li.done .t{background:var(--floresta);border-color:var(--floresta)}
.checks li.done .t svg{opacity:1}
.tip{width:100%;background:var(--linho);border-radius:22px;padding:16px 18px;display:flex;flex-direction:column;gap:4px;min-height:104px}
.tip b{font-family:var(--serif);font-size:1.25rem;font-weight:400;line-height:1.15}
.tip b em{color:var(--argila-ink)}
.tip span{font-size:.9375rem;color:var(--musgo)}
.tip.swapin{animation:in .5s var(--ease) both}

/* resultado */
.rhead{background:var(--floresta);color:var(--creme);border-radius:28px;padding:24px 20px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.rhead .ok{display:flex;align-items:center;gap:8px;font-size:.875rem;font-weight:600;color:var(--salvia)}
.rhead .ok .ic{width:18px;height:18px}
.rhead h1{color:var(--creme);font-size:clamp(2rem,9vw,2.5rem)}
.rhead h1 em{color:var(--argila-on-dark)}
.rhead p{color:var(--on-dark-muted)}
.rhead .facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
.rhead .facts div{background:rgba(244,240,232,.08);border:1px solid rgba(244,240,232,.12);border-radius:14px;padding:10px 8px;text-align:center;display:flex;flex-direction:column;gap:2px}
.rhead .facts b{font-family:var(--serif);font-weight:400;font-size:1.5rem;line-height:1;color:var(--creme);font-variant-numeric:tabular-nums}
.rhead .facts span{font-size:.72rem;color:var(--on-dark-muted);line-height:1.25}
.rhead .facts b.bmiv{color:var(--argila-on-dark)}
.scores{display:flex;flex-direction:column;gap:14px}
.score .row{display:flex;justify-content:space-between;align-items:baseline;font-size:.9375rem;gap:10px}
.score .row b{font-variant-numeric:tabular-nums}
.score .track{height:10px;border-radius:99px;background:var(--line-soft);overflow:hidden;margin-top:7px}
.score .track i{display:block;height:100%;border-radius:99px;width:0;transition:width 1.2s var(--ease)}
.meta{display:flex;align-items:center;gap:14px}
.meta .ring{flex:none;width:76px;height:76px}
.vs{display:grid;grid-template-columns:1fr 1fr;border-radius:22px;overflow:hidden;box-shadow:var(--shadow)}
.vs .col{display:flex;flex-direction:column;min-width:0}
.vs .hd{padding:13px 10px;text-align:center;font-family:var(--serif);font-size:1.25rem;line-height:1.1}
.vs .no{background:var(--branco)}
.vs .no .hd{background:var(--linho);color:var(--musgo)}
.vs .yes{background:var(--salvia-soft)}
.vs .yes .hd{background:var(--floresta);color:var(--creme)}
.vs .yes .hd em{color:var(--argila-on-dark)}

  !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');

  {id: 'compromisso', type: 'buttons', q: 'Se as receitas couberem no seu apetite e matarem a vontade de doce, <em>você testa por 7 dias?</em>', opts: [

// Etapas contadas no progresso e enviadas ao backend.
const QUESTION_IDX = STEPS.map((s, i) => (['loading', 'result'].includes(s.type) ? -1 : i)).filter((i) => i >= 0);
// Só as perguntas de verdade entram no contador "3/8".
const ASK_IDX = STEPS.map((s, i) => (['intro', 'buttons', 'multi', 'weight'].includes(s.type) ? i : -1)).filter((i) => i >= 0);

const state = {i: 0, a: {}};
const screen = $('#screen');
const back = $('#back');
const progress = $('#progress');

const progressCap = $('#progressCap');
const count = $('#count');

const go = (i) => {
  state.i = i;
  render();
  window.scrollTo({top: 0, behavior: 'auto'});
};
const next = () => {
  const s = STEPS[state.i];
  if (QUESTION_IDX.includes(state.i)) {
    const etapa = QUESTION_IDX.indexOf(state.i) + 1;
    track('QuizEtapa', {etapa}, true);
    const respostas = {};
    [s.id, ...(s.also || [])].forEach((k) => { if (k in state.a) respostas[k] = state.a[k]; });
    send('etapa', {etapa, respostas});

  go(state.i + 1);
};
back.addEventListener('click', () => {

const pick = (s, v, group, btn) => {

  setTimeout(next, 260);
};
const sint = () => (state.a.sintomas || []).filter((v) => v !== 'nenhum');
const idadeLabel = () => (IDADES.find((x) => x.v === state.a.idade) || IDADES[2]).l;
const peso = () => state.a.peso || 80;
const altura = () => state.a.altura || 165;
const imc = () => peso() / (altura() / 100) ** 2;
const fmt1 = (v) => v.toFixed(1).replace('.', ',');
// Faixas de IMC da OMS. As cores seguem as faixas do app (dessaturadas, coerentes com a paleta).
const IMC_FAIXAS = [
  {ate: 18.5, nome: 'Abaixo do peso', cor: '#8FA3AE'}, {ate: 25, nome: 'Peso adequado', cor: '#6F8F74'},
  {ate: 30, nome: 'Sobrepeso', cor: '#C9975F'}, {ate: 35, nome: 'Obesidade grau I', cor: '#B8744F'},
  {ate: 40, nome: 'Obesidade grau II', cor: '#A4552F'}, {ate: Infinity, nome: 'Obesidade grau III', cor: '#8A4426'}];
const imcFaixa = () => IMC_FAIXAS.find((f) => imc() < f.ate);
// Proteína de referência: 1,2 a 1,6 g/kg/dia. Com IMC de 30 ou mais, a conta usa o peso ajustado
// (peso no IMC 25 + 25% do que passa dele), como no app, para não superestimar a meta.
const pesoRef = () => {
  if (imc() < 30) return peso();
  const p25 = 25 * (altura() / 100) ** 2;
  return p25 + 0.25 * (peso() - p25);
};
const protMeta = () => { const p = pesoRef(); return [Math.round(p * 1.2), Math.round(p * 1.6)]; };
const contBtn = (id, label, onclick = next) => el('button', {type: 'button', class: 'btn', id, onclick}, label, icon('arrow'));
const markSvg = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

/* ---------- Telas ---------- */

  i60: ['Depois dos 60, o prato vale ainda mais.', 'Nessa fase manter músculo é o que garante disposição, equilíbrio e barriga firme. Com a fome baixa da caneta, as receitas certas fazem toda a diferença.']
};
// Curva ilustrativa: faixa de 3 a 8% de perda por década a partir dos 30, com a faixa da pessoa marcada.
const muscleChart = (faixa) => {
  const dec = [30, 40, 50, 60, 70];
  const x = (k) => 28 + k * 64;
  const yA = (k) => 18 + k * 8;     // perda menor (3%)
  const yB = (k) => 18 + k * 20;    // perda maior (8%)
  const area = `M${x(0)} ${yA(0)} ${dec.map((_, k) => `L${x(k)} ${yA(k)}`).join(' ')} ${dec.slice().reverse().map((_, k) => `L${x(4 - k)} ${yB(4 - k)}`).join(' ')} Z`;
  const mid = dec.map((_, k) => `${k ? 'L' : 'M'}${x(k)} ${(yA(k) + yB(k)) / 2}`).join(' ');
  const hi = {i18: -1, i30: 0, i40: 1, i50: 2, i60: 3}[faixa] ?? 1;
  const dot = hi >= 0 ? `<circle cx="${x(hi)}" cy="${(yA(hi) + yB(hi)) / 2}" r="6" style="fill:#D9A07E;stroke:#17332B" stroke-width="2.5"/><text x="${x(hi)}" y="${(yA(hi) + yB(hi)) / 2 - 12}" text-anchor="middle" style="fill:#F4F0E8">você</text>` : '';
  return `<svg class="chart" viewBox="0 0 320 128" role="img" aria-label="Gráfico ilustrativo: a massa muscular cai entre 3 e 8% a cada década depois dos 30">
    <path d="${area}" style="fill:rgba(217,160,126,.22)"/>
    <path d="${mid}" style="fill:none;stroke:#D9A07E" stroke-width="2.5" stroke-linecap="round"/>
    ${dec.map((d, k) => `<text x="${x(k)}" y="122" text-anchor="middle" style="fill:#A9B8AC">${d}</text>`).join('')}
    ${dot}</svg>`;
};

const renderMulti = (s) => {
  const sel = new Set(state.a[s.id] || []);
  const opts = s.opts.map(norm);
  const cont = contBtn(`cont-${s.id}`, 'Continuar', null);
  cont.classList.add('stick');
  const wrap = el('div', {class: 'opts', role: 'group'});
  const sync = () => {
    wrap.querySelectorAll('.opt').forEach((x) => x.setAttribute('aria-pressed', String(sel.has(x.dataset.v))));
    cont.setAttribute('aria-disabled', String(sel.size === 0));
  };
  opts.forEach((o) => {
    const b = optBtn(s, o, true);
    b.addEventListener('click', () => {
      if (sel.has(o.v)) sel.delete(o.v);
      else {

      state.a[s.id] = [...sel];
      sync();

    wrap.append(b);
  });
  cont.addEventListener('click', () => { if (sel.size) next(); });

// Peso e altura na mesma tela, com o IMC mudando ao vivo.

  box.append(el('span', {class: 'lbl'}, label), val,
    el('div', {class: 'row'},

  return {box, set};
};

// Proteína de um dia típico para cada hábito: estimativa ilustrativa para a comparação.
const PROT_TIPICA = {economia: 30, gelado: 35, doce: 25, lanche: 50, prato_pequeno: 45};
const ESPELHO = {
  fome: ['prato', 'Quase não sente fome', 'Comendo pouco, a proteína do dia não fecha, e o corpo tira do músculo.'],
  doce: ['doce', 'Vontade forte de doce', 'Doce entra fácil quando a fome está baixa, mas ocupa o espaço da proteína.'],
  gelado: ['floco', 'Só desce gelado ou líquido', 'Iogurte, açaí e sorvete descem bem, mas quase sempre têm pouca proteína.'],
  lanche: ['lanche', 'Vontade de hambúrguer', 'Não precisa cortar. Na versão certa, o hambúrguer vira aliado.'],
  cansaco: ['bateria', 'Cansaço e desânimo', 'Pouca comida e pouca proteína derrubam a energia do dia.'],
  academia: ['halter', 'Sem pique para treinar', 'Sem energia não tem treino, e sem treino o músculo vai embora mais rápido.'],
  enjoo: ['enjoo', 'Enjoo com comida pesada', 'Porções pequenas, frias e leves costumam enjoar menos.']
};
const renderMirror = () => {
  const [min, max] = protMeta();
  const tipica = PROT_TIPICA[state.a.come] || 35;
  const itens = sint().map((v) => ESPELHO[v]).filter(Boolean);
  const out = [H('h2', 'Olha o que as suas respostas <em>mostram</em>')];
  if (itens.length) {
    out.push(el('div', {class: 'sheet'}, el('ul', {class: 'mirror'}, itens.map(([i, t, d]) => el('li', {}, H('span', ic(i), 'tile'), el('div', {}, el('b', {}, t), el('span', {}, d)))))));
  } else {
    out.push(el('p', {class: 'c lead'}, 'Você não marcou nenhum sinal. Mesmo assim, com a fome baixa, o mais comum é a proteína do dia ficar abaixo do que o corpo precisa.'));
  }
  out.push(bmiBlock());
  const pct = clamp(Math.round((tipica / min) * 100), 8, 100);
  const bars = [el('i', {style: 'background:var(--argila-cta)', 'data-w': pct}), el('i', {style: 'background:var(--floresta)', 'data-w': 100})];
  out.push(el('div', {class: 'sheet gauge'},
    H('h3', `Com ${peso()} kg e ${(altura() / 100).toFixed(2).replace('.', ',')} m, o seu corpo pede <em>${min} a ${max} g de proteína</em> por dia`),
    el('div', {class: 'row'}, el('span', {}, 'Um dia típico como o seu'), el('b', {}, `~${tipica} g`)),
    el('div', {class: 'track'}, bars[0]),
    el('div', {class: 'row'}, el('span', {}, 'O que o corpo pede'), el('b', {}, `${min} g+`)),
    el('div', {class: 'track'}, bars[1]),
    el('p', {class: 'src'}, `Referência de 1,2 a 1,6 g/kg/dia para quem está emagrecendo${imc() >= 30 ? ', calculada sobre o peso ajustado (o usado quando o IMC passa de 30)' : ''}. O dia típico é uma estimativa pelo que você marcou, não uma medida.`)));
  setTimeout(() => bars.forEach((b) => { b.style.width = b.dataset.w + '%'; }), reduceMotion ? 0 : 150);
  out.push(H('p', 'Não é falta de disciplina. É que <b>o cardápio comum não foi feito para o apetite da caneta.</b>', 'c'));
  out.push(contBtn('cont-espelho', 'E o que eu faço?'));
  return out;
};

        el('li', {}, el('span', {class: 'n'}, '2'), el('div', {}, el('b', {}, 'Porção do tamanho do apetite'), el('span', {}, 'Pequeno e frequente rende mais que um prato que não desce.'))),

  ];
};

const DICAS = [
  ['Proteína <em>primeiro</em>', 'Comece o prato pela proteína. Se a fome acabar no meio, o mais importante já foi.'],
  ['Cada garfada <em>conta</em>', 'Em dias sem apetite, iogurte proteico, ovos ou um shake garantem a base do dia.'],
  ['Pequeno e <em>frequente</em>', 'Três refeições pequenas e dois lanches rendem mais do que uma refeição grande que não desce.'],
  ['Deixe algo <em>pronto</em>', 'Ter algo proteico pronto na geladeira evita pular refeição nos dias de pouca fome.']
];
const renderLoading = () => {
  const items = ['Analisando as suas respostas', 'Calculando a sua proteína do dia', 'Separando receitas geladas e doces', 'Montando o seu Dia 1'];
  const ul = el('ul', {class: 'checks'}, items.map((t) => el('li', {}, H('span', markSvg, 't'), t)));
  const mark = H('div', capsuleSvg('big', '#17332B', '#B8744F', 0));
  const pct = el('div', {class: 'pct', 'aria-hidden': 'true'}, '0%');
  const tip = el('div', {class: 'tip', role: 'note'});
  let ti = -1;
  const showTip = () => { ti = (ti + 1) % DICAS.length; tip.classList.remove('swapin'); void tip.offsetWidth; tip.classList.add('swapin'); tip.innerHTML = `<b>${DICAS[ti][0]}</b><span>${DICAS[ti][1]}</span>`; };
  showTip();
  const total = reduceMotion ? 1200 : 5200;
  const t0 = performance.now();
  let lastTip = t0;
  const tick = (now) => {
    if (STEPS[state.i].type !== 'loading') return;
    const p = Math.min(1, (now - t0) / total);
    const v = Math.min(100, Math.round((p < 0.75 ? p * 1.05 : 0.7875 + (p - 0.75) * 0.85) * 100));
    const path = mark.querySelector('path');
    if (path) path.setAttribute('stroke-dashoffset', String(62 * (1 - v / 100)));
    pct.textContent = v + '%';
    [...ul.children].forEach((li, k) => li.classList.toggle('done', v >= (k + 1) * 24));
    if (now - lastTip > 2400) { lastTip = now; showTip(); }
    if (p < 1) requestAnimationFrame(tick);
    else setTimeout(() => {
      if (STEPS[state.i].type !== 'loading') return;
      send('concluido', {etapa: QUESTION_IDX.length + 1, perfil: perfilId()});
      track('QuizCompleto', {}, true);
      next();
    }, 450);
  };
  requestAnimationFrame(tick);
  return [H('h2', 'Montando o seu <em>plano de receitas</em>'), el('p', {class: 'hint'}, 'Estamos cruzando as suas respostas.'),
    el('div', {class: 'loader', role: 'status', 'aria-label': 'Montando o seu plano'}, mark, pct, ul, tip)];
};

/* ---------- Resultado ---------- */
const PERFIS = {
  economia: {nome: 'Apetite no modo economia', txt: 'A caneta tirou a fome e você passa o dia beliscando. O corpo emagrece, mas parte do que sai é músculo, e por isso vem o cansaço e a pochete não sai. Seu plano começa com mini-refeições que fecham a proteína em poucas garfadas.'},
  gelado: {nome: 'Só desce gelado', txt: 'Com a caneta, o corpo pede coisas frias e leves. O problema é que os gelados comuns quase não têm proteína. Seu plano troca o sorvete e o açaí por versões cremosas que alimentam de verdade.'},
  doce: {nome: 'Doce no lugar da comida', txt: 'Com a fome baixa, o doce entra fácil e ocupa o espaço da comida. Seu plano mantém o doce todos os dias, só que em receitas com proteína que seguram a vontade.'},
  lanche: {nome: 'Fome de hambúrguer', txt: 'A vontade de lanche continua mesmo com a caneta. Em vez de lutar contra ela, seu plano traz hambúrguer, pizza e salgado caseiros, no tamanho do seu apetite e com a proteína que o corpo precisa.'},
  prato_pequeno: {nome: 'Prato encolhido', txt: 'Você come comida de verdade, só que bem menos, e a parte que sobra no prato costuma ser a proteína. Seu plano muda a ordem e a proporção do prato para cada garfada contar.'}
};
const perfilId = () => (PERFIS[state.a.come] ? state.a.come : 'gelado');
const COVERS = [
  ['#17332B', '#F4F0E8', '#B8744F', 'Gelados', 'que nutrem'],
  ['#B8744F', '#F4F0E8', '#F4F0E8', 'Doces', 'com proteína'],
  ['#B7C4B1', '#17332B', '#B8744F', 'Lanches', 'de casa'],
  ['#E4DDCF', '#17332B', '#B8744F', 'Mini', 'refeições']
];

const renderResult = () => {
  const a = state.a;
  const s = sint();
  const perfil = PERFIS[perfilId()];
  const [min, max] = protMeta();
  const porRefeicao = Math.round(min / 4);
  const out = [];

  out.push(el('section', {class: 'rhead'},
    H('span', ic('saiu') + 'Seu resultado está pronto', 'ok'),
    H('h1', `Seu perfil: <em>${perfil.nome}</em>`),
    el('p', {}, perfil.txt),
    el('div', {class: 'facts'},
      H('div', `<b class="bmiv">${fmt1(imc())}</b><span>IMC · ${imcFaixa().nome.toLowerCase()}</span>`),
      H('div', `<b>${peso()} kg</b><span>peso hoje</span>`),
      H('div', `<b>${min} g</b><span>proteína mínima/dia</span>`))));

  const musculo = clamp(30 + (s.includes('fome') ? 18 : 0) + ({economia: 22, doce: 18, gelado: 16, prato_pequeno: 10, lanche: 6}[a.come] || 10)
    + (['i40', 'i50', 'i60'].includes(a.idade) ? 10 : 0) + (s.includes('cansaco') ? 6 : 0) + (s.includes('academia') ? 6 : 0), 20, 94);
  const vontade = clamp(20 + (s.includes('doce') ? 28 : 0) + (s.includes('gelado') ? 20 : 0) + (s.includes('lanche') ? 18 : 0) + (['doce', 'gelado', 'lanche'].includes(a.come) ? 14 : 0), 12, 95);
  const energia = clamp(78 - (s.includes('cansaco') ? 26 : 0) - (s.includes('academia') ? 14 : 0) - (s.includes('fome') ? 10 : 0), 18, 90);
  const destravar = clamp(62 + (a.compromisso === 'sim' ? 22 : 10) + (a.tempo === 't5' ? 6 : 4) + (a.pochete === 'travou' ? 4 : 0), 40, 96);
  const scoreRow = (lbl, v, color, id) => el('div', {class: 'score'},
    el('div', {class: 'row'}, el('span', {}, lbl), el('b', {}, v + '%')),
    el('div', {class: 'track'}, el('i', {id, 'data-w': v, style: `background:${color}`})));
  out.push(el('div', {class: 'sheet'},
    H('h3', 'Análise das suas respostas'),
    el('div', {class: 'scores'},
      scoreRow('Risco de perder músculo junto com a gordura', musculo, 'var(--danger)', 'sc1'),
      scoreRow('Força da vontade de doce, gelado ou lanche', vontade, 'var(--argila)', 'sc2'),
      scoreRow('Energia no dia a dia', energia, 'var(--argila)', 'sc3'),
      scoreRow('Chance de destravar a barriga com o prato certo', destravar, 'var(--floresta)', 'sc4')),
    el('p', {class: 'src'}, 'Pontuação do teste, calculada pelas suas respostas. Não é diagnóstico.')));

  const C = 2 * Math.PI * 32;
  out.push(el('div', {class: 'sheet'},
    el('div', {class: 'meta'},
      H('div', `<svg class="ring" viewBox="0 0 76 76" aria-hidden="true"><circle cx="38" cy="38" r="32" style="fill:none;stroke:#ECE6DA" stroke-width="7"/><circle cx="38" cy="38" r="32" style="fill:none;stroke:#B8744F" stroke-width="7" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * 0.25}" transform="rotate(-90 38 38)"/><text x="38" y="44" text-anchor="middle" style="fill:#17332B;font-family:'Instrument Serif',Georgia,serif;font-size:19px">4×</text></svg>`),
      el('div', {}, H('h3', `Sua meta: <em>${min} a ${max} g</em> de proteína por dia`),
        el('p', {class: 'src', style: 'font-size:.875rem;margin-top:4px'}, `Em 4 momentos, cerca de ${porRefeicao} g por vez.`))),
    el('p', {}, 'Parece muito para quem quase não sente fome, e é por isso que as receitas são pensadas para caber em poucas garfadas.')));

  const vsNo = ['Come pouco e a proteína não fecha', 'Doce e gelado sem nada de proteína', 'Cansaço e zero pique para treinar', 'A pochete continua lá'];
  const vsYes = ['Porção pequena que alimenta', 'Gelado e doce que seguram a vontade', 'Mais energia ao longo do dia', 'O corpo queima gordura, não músculo'];
  out.push(el('div', {class: 'vs'},
    el('div', {class: 'col no'}, el('div', {class: 'hd'}, 'Como está hoje'), vsNo.map((t) => H('div', ic('x') + `<span>${t}</span>`, 'it'))),
    el('div', {class: 'col yes'}, H('div', 'Com as receitas <em>certas</em>', 'hd'), vsYes.map((t) => H('div', ic('check') + `<span>${t}</span>`, 'it')))));

  const rapido = a.tempo === 't5';
  const gel = s.includes('gelado') || a.come === 'gelado';
  const meals = [
    ['xicara', 'Café da manhã', s.includes('enjoo') || a.come === 'economia' ? 'Shake gelado de café com leite e proteína. Desce fácil mesmo sem fome.' : 'Ovos mexidos cremosos com queijo + café. Pronto em 5 minutos.', 22],
    ['prato', 'Almoço', a.come === 'lanche' ? 'Hambúrguer caseiro no prato com salada e batata rústica, porção pequena.' : (rapido ? 'Frango desfiado pronto da geladeira com legumes e 2 colheres de arroz.' : 'Prato pequeno: carne ou frango primeiro, depois legumes e 2 colheres de arroz.'), 30],
    [gel ? 'gelado' : 'doce', 'Lanche da tarde', gel ? 'Sorvete cremoso de chocolate proteico (3 ingredientes, no liquidificador).' : 'Mousse de chocolate com proteína para a hora da vontade de doce.', 18],
    ['bowl', 'Jantar', s.includes('enjoo') ? 'Caldo leve de frango com legumes, em porção pequena.' : (a.come === 'lanche' ? 'Pizza de frigideira com massa de frango.' : 'Omelete recheada com legumes e queijo.'), 25]
  ];
  const chips = [];
  if (rapido) chips.push(['raio', 'Até 5 minutos']);
  if (gel) chips.push(['floco', 'Opções geladas']);
  if (s.includes('doce') || a.come === 'doce') chips.push(['doce', 'Doce todo dia']);
  if (s.includes('enjoo')) chips.push(['folha', 'Leve para o enjoo']);
  out.push(H('h2', 'Veja como fica o <em>seu Dia 1</em>'));
  if (chips.length) out.push(el('div', {class: 'chips'}, chips.map(([i, c]) => H('span', ic(i) + c, 'chip'))));
  const day = el('div', {class: 'day', id: 'dia1'},
    el('div', {class: 'hd'}, el('b', {}, 'Dia 1'), el('small', {}, 'montado pelas suas respostas')),
    meals.map(([i, t, d, g]) => el('div', {class: 'meal'}, H('span', ic(i), 'tile'), el('div', {}, el('span', {class: 'when'}, t), d, el('br'), el('span', {class: 'pt'}, `~${g} g de proteína`)))));
  out.push(day);
  out.push(el('p', {class: 'fine'}, `Total aproximado do Dia 1: ~${meals.reduce((t, m) => t + m[3], 0)} g de proteína. As receitas completas, com quantidades e variações, ficam no material.`));

  out.push(el('div', {class: 'note', role: 'note'}, H('span', ic('info')),
    el('div', {}, el('strong', {}, 'A caneta continua do jeito que o seu médico passou.'),
      el('span', {}, 'As receitas cuidam do prato. Dose, troca de medicamento e efeitos colaterais fortes são sempre com o seu médico.'))));

  out.push(el('div', {class: 'sheet'},
    H('h3', `O que vem no <em>${CONFIG.produto}</em>`),
    el('div', {class: 'covers', 'aria-hidden': 'true'}, COVERS.map(([bg, fg, ac, t1, t2]) =>
      el('div', {class: 'cover', style: `background:${bg};color:${fg}`}, H('span', capsuleSvg('cm', fg, ac)), H('b', `${t1}<i>${t2}</i>`), el('hr', {style: `background:${ac}`})))),
    el('ul', {class: 'deliv'}, CONFIG.entregaveis.map(([i, t, d]) => el('li', {}, H('span', ic(i), 'tile'), el('div', {}, el('b', {}, t), el('span', {}, d))))),
    CONFIG.bonus.length ? el('ul', {class: 'deliv'}, CONFIG.bonus.map((b) => el('li', {}, H('span', ic('check'), 'tile'), el('div', {}, el('b', {}, 'Bônus: ' + b))))) : null));

  const href = checkoutHref();
  const setupMsg = el('div', {class: 'setup', role: 'note', hidden: SETUP ? null : true},
    el('strong', {}, 'Falta configurar o checkout'),
    H('span', 'Coloque o seu link em <code>CONFIG.checkoutUrl</code> no topo do arquivo. Enquanto isso, o botão não leva a lugar nenhum.'));
  const onBuy = (ev) => {
    ev.preventDefault();
    if (!CONFIG.checkoutUrl) { setupMsg.hidden = false; setupMsg.scrollIntoView({behavior: 'smooth', block: 'center'}); return; }
    send('checkout', {etapa: QUESTION_IDX.length + 2});
    track('InitiateCheckout', {value: CONFIG.preco, currency: 'BRL'});
    setTimeout(() => { location.href = href; }, 250);
  };
  const [reais, cents] = CONFIG.preco.toFixed(2).split('.');
  out.push(el('div', {class: 'offer', id: 'oferta'},
    H('h2', 'Seu plano de receitas <em>está pronto</em>'),
    el('p', {class: 'for'}, `Receitas para o perfil ${perfil.nome}, com as opções que você marcou.`),
    CONFIG.precoDe ? el('span', {class: 'de'}, `De ${fmtBRL(CONFIG.precoDe)}`) : null,
    H('span', `<small>R$</small>${reais},${cents}`, 'por'),
    el('span', {class: 'sub'}, 'Pagamento único · acesso imediato no seu e-mail'),
    el('a', {class: 'btn buy pulse', id: 'cta', href, onclick: onBuy}, 'Quero minhas receitas', icon('arrow')),
    el('div', {class: 'pay', 'aria-label': 'Formas de pagamento'}, H('span', ic('pix') + 'Pix'), H('span', ic('cartao') + 'Cartão'), H('span', ic('cadeado') + 'Compra segura')),
    el('div', {class: 'guarantee'}, H('span', sealSvg(CONFIG.garantiaDias)), el('span', {}, el('b', {}, `Garantia de ${CONFIG.garantiaDias} dias. `), 'Se não gostar, devolvemos 100% do valor.')),
    setupMsg));

  const au = CONFIG.autor;
  if (au.nome) {
    const ph = el('div', {class: 'ph'});
    if (au.foto) ph.append(el('img', {src: au.foto, alt: au.nome, loading: 'lazy'})); else ph.textContent = au.nome.split(' ').map((w) => w[0]).slice(0, 2).join('');
    out.push(el('div', {class: 'sheet'},
      H('h3', 'Quem montou <em>as receitas</em>'),
      el('div', {class: 'author'}, ph, el('div', {}, el('b', {}, au.nome), au.registro ? el('div', {class: 'reg'}, au.registro) : null)),
      au.bio ? el('p', {}, au.bio) : null));
  }

  if (CONFIG.depoimentos.length) {
    out.push(H('h2', 'Quem já está <em>usando as receitas</em>'));
    out.push(el('div', {class: 'chat'}, CONFIG.depoimentos.map((d) => el('div', {class: 'bubble'}, d.texto, el('span', {class: 'who'}, d.nome)))));
  } else if (SETUP) {
    out.push(el('div', {class: 'setup', role: 'note'}, el('strong', {}, 'Espaço para depoimentos'), H('span', 'Adicione depoimentos reais, com autorização, em <code>CONFIG.depoimentos</code>. Sem depoimentos, esta parte some.')));
  }

  const faq = [
    ['Serve para qualquer caneta?', 'Sim. As receitas cuidam do prato e servem para quem usa Mounjaro, Ozempic, Wegovy, Saxenda ou outra, e também para quem parou e quer manter o resultado.'],
    ['E se eu quase não sinto fome?', 'É exatamente para isso: porções pequenas, muitas delas geladas ou líquidas, que fecham a proteína em poucas garfadas.'],
    ['Preciso comprar whey ou suplemento?', 'Não é obrigatório. Várias receitas usam ovos, frango, iogurte e queijo. Onde o whey entra, tem a versão sem ele.'],
    ['Preciso mudar a dose da caneta?', 'Não. Nada aqui mexe no seu tratamento. Dose e medicamento são sempre com o seu médico.'],
    ['Como eu recebo?', 'Logo depois do pagamento, o acesso chega no seu e-mail. Dá para ver no celular ou imprimir.'],
    ['E se eu não gostar?', `Você tem ${CONFIG.garantiaDias} dias de garantia. É só pedir o reembolso e devolvemos 100% do valor.`]
  ];
  out.push(el('div', {class: 'sheet faq'}, H('h3', 'Perguntas <em>frequentes</em>'), faq.map(([q, r]) => el('details', {}, H('summary', `<span>${q}</span>${ic('plus')}`), el('p', {}, r)))));
  out.push(el('a', {class: 'btn buy', id: 'cta-2', href, onclick: onBuy}, 'Quero minhas receitas', icon('arrow')));
  out.push(el('p', {class: 'fine'}, 'Material educativo. Não substitui consulta médica ou com nutricionista. Os resultados variam de pessoa para pessoa.'));

  $('#stickyPrice').textContent = fmtBRL(CONFIG.preco);
  const sc = $('#stickyCta');
  sc.href = href;
  sc.onclick = onBuy;
  // A barra fixa de compra só aparece depois que a pessoa viu o Dia 1: primeiro o valor, depois o preço.
  sticky.hidden = true;
  if ('IntersectionObserver' in window) {
    const io = new IntersectionObserver((entries) => {
      if (entries.some((e) => e.isIntersecting || e.boundingClientRect.top < 0)) { sticky.hidden = STEPS[state.i].type !== 'result'; io.disconnect(); }
    });
    setTimeout(() => io.observe(day), 0);
  } else {
    sticky.hidden = false;
  }
  track('ViewContent', {value: CONFIG.preco, currency: 'BRL'});
  setTimeout(() => { ['sc1', 'sc2', 'sc3', 'sc4'].forEach((id) => { const b = document.getElementById(id); if (b) b.style.width = b.dataset.w + '%'; }); }, reduceMotion ? 0 : 150);
  return out;
};

/* ---------- Render ---------- */
const RENDER = {intro: renderIntro, age: renderAge, buttons: renderButtons, multi: renderMulti, insight: renderInsight,
  weight: renderWeight, mirror: renderMirror, solution: renderSolution, loading: renderLoading, result: renderResult};
const render = () => {
  const s = STEPS[state.i];
  const qi = QUESTION_IDX.indexOf(state.i);
  back.hidden = state.i === 0 || s.type === 'loading';
  progress.hidden = state.i === 0 || s.type === 'result';
  const w = s.type === 'loading' ? 100 : Math.round(((qi + 1) / (QUESTION_IDX.length + 1)) * 100);
  progressFill.style.width = w + '%';
  progressCap.style.left = `calc(${w}% - ${(w * 0.24).toFixed(1)}px)`;
  // Contador de perguntas: na pergunta mostra a posição dela; nas telas de explicação mantém a última respondida.
  const feitas = ASK_IDX.filter((k) => k <= state.i).length;
  count.textContent = state.i === 0 || ['loading', 'result'].includes(s.type) ? '' : `${feitas}/${ASK_IDX.length}`;
  if (s.type !== 'result') sticky.hidden = true;
  screen.replaceChildren(...RENDER[s.type](s).filter(Boolean));
  screen.style.animation = 'none';
  void screen.offsetWidth;
  screen.style.animation = '';
  const first = screen.querySelector('h1,h2');
  if (first && state.i > 0) { first.setAttribute('tabindex', '-1'); try { first.focus({preventScroll: true}); } catch (e) {} }
};
render();
