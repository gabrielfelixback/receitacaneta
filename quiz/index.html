<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FFFFFF">
<title>Teste • Além da Caneta</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2317332B'/%3E%3Crect x='7' y='25' width='34' height='17' rx='8.5' fill='none' stroke='%23F4F0E8' stroke-width='3.6'/%3E%3Cline x1='29' y1='25' x2='29' y2='42' stroke='%23F4F0E8' stroke-width='3.6'/%3E%3Cpath d='M41 33.5 H45 C51 33.5 54 27 58 15' fill='none' stroke='%23D9A07E' stroke-width='3.6' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap">
<style>
/* Identidade "além da caneta": Creme/Linho de base, Floresta/Sálvia/Musgo de apoio, Argila só como acento.
   Instrument Serif nos títulos (itálico só na palavra-chave) e Instrument Sans no resto. Tema claro único, de propósito. */
:root{
  color-scheme:light;
  --floresta:#17332B;
  --creme:#F4F0E8;
  --linho:#E4DDCF;
  --salvia:#B7C4B1;
  --salvia-soft:#E8ECE3;
  --musgo:#4A5E52;
  --argila:#B8744F;          /* traços e preenchimentos */
  --argila-ink:#9A5A39;      /* texto argila sobre creme/branco (4,7:1) */
  --argila-cta:#A65E3A;      /* fundo do botão de compra (4,8:1 com branco) */
  --argila-dark:#7F4A2E;
  --argila-on-dark:#D9A07E;  /* texto argila sobre floresta (6:1) */
  --argila-soft:#F3E6DC;
  --branco:#FFFDF9;
  --on-dark-muted:#A9B8AC;
  --line:#DCD4C4;
  --line-soft:#ECE6DA;
  --danger:#A4442C;
  --serif:"Instrument Serif",Georgia,"Times New Roman",serif;
  --sans:"Instrument Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --shadow:0 1px 2px rgba(23,51,43,.06),0 4px 14px rgba(23,51,43,.05);
  --shadow-lift:0 2px 4px rgba(23,51,43,.08),0 10px 24px rgba(23,51,43,.08);
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--creme);color:var(--floresta);font-family:var(--sans);font-size:1rem;line-height:1.5;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;padding-top:env(safe-area-inset-top,0px)}
::selection{background:var(--salvia);color:var(--floresta)}
[hidden]{display:none!important}
img{max-width:100%}
svg{display:block}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.shell{max-width:30rem;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}

/* topo: marca, voltar, contador e a linha argila como progresso */
.top{position:sticky;top:0;z-index:4;background:var(--creme);padding-top:6px;padding-bottom:10px;margin-bottom:6px}
.bar{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;min-height:48px}
.top.quiz .bar{min-height:0}
.top.quiz .logo{display:none}
.top.quiz{display:grid;grid-template-columns:44px 1fr;align-items:center;gap:6px;padding-top:8px}
.top.quiz .bar{grid-template-columns:44px}
.back{all:unset;cursor:pointer;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--musgo);transition:background .2s}
.back:hover{background:var(--linho);color:var(--floresta)}
.logo{grid-column:2;justify-self:center;display:flex;align-items:center;gap:8px;color:var(--floresta);line-height:1}
.logo .mark{width:40px;height:18px}
.logo .word{font-family:var(--serif);font-size:1.375rem;letter-spacing:-.005em;white-space:nowrap}
.logo .word i{font-style:italic}
.progress{position:relative;height:16px;display:flex;align-items:center}
.progress .track{position:absolute;left:0;right:0;height:3px;border-radius:3px;background:var(--line)}
.progress .fill{position:absolute;left:0;height:3px;border-radius:3px;background:var(--argila);width:0;transition:width .6s var(--ease)}
.progress .cap{position:absolute;top:2px;width:24px;height:12px;left:0;transition:left .6s var(--ease)}

.screen{display:flex;flex-direction:column;gap:18px;animation:in .45s var(--ease) both}
@keyframes in{from{opacity:.001;transform:translateY(12px)}to{opacity:1;transform:none}}

/* tipografia */
h1,h2,h3{margin:0;font-weight:400;text-wrap:balance}
h1{font-family:var(--serif);font-size:clamp(2.25rem,10vw,2.875rem);line-height:1.02;letter-spacing:-.015em}
h2{font-family:var(--serif);font-size:clamp(1.875rem,8.2vw,2.25rem);line-height:1.06;letter-spacing:-.01em;text-align:center}
h3{font-family:var(--sans);font-weight:600;font-size:1.0625rem;line-height:1.3}
h1 em,h2 em,h3 em{font-family:var(--serif);font-style:italic;color:var(--argila-ink)}
h3 em{font-size:1.15em;font-weight:400}
p{margin:0;text-wrap:pretty}
b,strong{font-weight:600}
.c{text-align:center}
.lead{color:var(--musgo);text-align:center;font-size:1.0625rem}
.hint{color:var(--musgo);font-size:.9375rem;text-align:center;margin-top:-8px}
.fine{font-size:.8125rem;color:var(--musgo);text-align:center;line-height:1.45}
.src{font-size:.75rem;color:var(--musgo);line-height:1.4}
.num{font-variant-numeric:tabular-nums}

/* botões */
.btn{all:unset;box-sizing:border-box;cursor:pointer;width:100%;min-height:58px;padding:15px 22px;border-radius:999px;background:var(--floresta);color:var(--creme);font-family:var(--sans);font-weight:600;font-size:1.0625rem;text-align:center;display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;line-height:1.25;box-shadow:0 2px 0 rgba(0,0,0,.18),0 10px 22px rgba(23,51,43,.18);transition:transform .15s var(--ease),box-shadow .15s,opacity .2s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(1px);box-shadow:0 1px 0 rgba(0,0,0,.18),0 4px 10px rgba(23,51,43,.18)}
.btn .ic{width:20px;height:20px}
.btn.stick{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:3;margin-top:auto}
.screen{min-height:calc(100svh - 96px)}
.btn[aria-disabled="true"]{opacity:.38;cursor:not-allowed;transform:none}
.btn.buy{background:var(--argila-cta);color:var(--branco);min-height:64px;font-size:1.125rem;font-weight:700;box-shadow:0 3px 0 var(--argila-dark),0 12px 26px rgba(166,94,58,.32)}
.btn.buy:active{box-shadow:0 1px 0 var(--argila-dark),0 4px 10px rgba(166,94,58,.3)}
.pulse{animation:pulse 2.2s var(--ease) infinite}
@keyframes pulse{0%,100%{box-shadow:0 3px 0 var(--argila-dark),0 12px 26px rgba(166,94,58,.32),0 0 0 0 rgba(184,116,79,.45)}60%{box-shadow:0 3px 0 var(--argila-dark),0 12px 26px rgba(166,94,58,.32),0 0 0 12px rgba(184,116,79,0)}}

/* opções */
.opts{display:flex;flex-direction:column;gap:10px}
.opt{all:unset;box-sizing:border-box;cursor:pointer;width:100%;min-height:66px;padding:11px 14px 11px 11px;border:1.5px solid var(--line-soft);border-radius:18px;background:var(--branco);display:flex;align-items:center;gap:13px;font-weight:500;font-size:1rem;line-height:1.3;box-shadow:var(--shadow);transition:border-color .2s,background .2s,transform .15s var(--ease)}
.opt:hover{border-color:var(--salvia)}
.opt:active{transform:scale(.985)}
.opt .tile{flex:none;width:44px;height:44px;border-radius:13px;background:var(--creme);display:grid;place-items:center;color:var(--floresta);transition:background .2s,color .2s}
.opt .lbl{flex:1}
.opt .mark{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;transition:background .2s,border-color .2s}
.opt.sq .mark{border-radius:7px}
.opt .mark svg{width:12px;height:12px;stroke:var(--floresta);stroke-width:3;fill:none;opacity:0;transform:scale(.4);transition:opacity .2s,transform .3s var(--ease)}
.opt[aria-pressed="true"]{border-color:var(--floresta);background:var(--floresta);color:var(--creme)}
.opt[aria-pressed="true"] .tile{background:rgba(244,240,232,.12);color:var(--argila-on-dark)}
.opt[aria-pressed="true"] .mark{background:var(--argila-on-dark);border-color:var(--argila-on-dark)}
.opt[aria-pressed="true"] .mark svg{opacity:1;transform:none}
.opt.plain{min-height:56px;padding-left:16px}
.btn:focus-visible,.opt:focus-visible,.icard:focus-visible,.back:focus-visible,summary:focus-visible,.step:focus-visible,input[type=range]:focus-visible{outline:2.5px solid var(--argila);outline-offset:3px}

/* abertura */
.hook-pic{border-radius:24px;overflow:hidden;background:var(--linho);aspect-ratio:16/9}
.hook-pic{position:relative}
.vsl-som{all:unset;cursor:pointer;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:10px;background:rgba(23,51,43,.88);color:#FFFFFF;font-weight:700;font-size:1rem;padding:12px 18px 12px 14px;border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:somPulse 1.8s var(--ease) infinite;white-space:nowrap}
.vsl-som span{width:30px;height:30px;border-radius:50%;background:var(--argila-cta);display:grid;place-items:center}
.vsl-som svg{width:17px;height:17px;fill:#FFFFFF;stroke:#FFFFFF;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.vsl-som:focus-visible{outline:3px solid var(--argila);outline-offset:3px}
@keyframes somPulse{0%,100%{box-shadow:0 6px 20px rgba(0,0,0,.25),0 0 0 0 rgba(184,116,79,.55)}60%{box-shadow:0 6px 20px rgba(0,0,0,.25),0 0 0 14px rgba(184,116,79,0)}}
.vsl-barra{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.35)}
.vsl-barra i{display:block;height:100%;width:0;background:var(--argila-cta);transition:width .25s linear}
.hook-pic > svg,.hook-pic > img,.hook-pic > video,.qpic > img,.crowd-pic > img{width:100%;height:100%;object-fit:cover;display:block}
.hook-h{text-align:center;font-size:clamp(2rem,9vw,2.625rem);line-height:1.04}
.hook-h em{color:var(--argila-ink)}
.hook-ask{font-weight:700;text-align:center;font-size:1.0625rem;margin-top:2px}
.opts.big .opt{min-height:60px;font-size:1.0625rem;font-weight:600}
.secret{display:flex;align-items:center;justify-content:center;gap:6px;font-size:.8125rem;color:var(--musgo);font-weight:500}
.secret .ic{width:15px;height:15px}
.consent{font-size:.75rem;color:var(--musgo);text-align:center;margin-top:-8px;text-wrap:balance}
.consent a,.fine a{color:var(--argila-ink);text-underline-offset:2px}
.crowd-pic{border-radius:22px;overflow:hidden;aspect-ratio:941/705;background:#F7F5F0}
h2.caminho{font-family:var(--sans);font-weight:500;font-size:clamp(1.5rem,6.4vw,1.75rem);letter-spacing:-.01em}
h2.caminho em{font-family:var(--serif);font-style:italic;font-weight:400;font-size:1.12em}
.cstat{text-align:center;font-size:clamp(1.375rem,6vw,1.625rem);line-height:1.22;font-weight:500;letter-spacing:-.015em;text-wrap:balance}
.cstat b{font-weight:700}
.cstat .nw{white-space:nowrap}
.infobox.lf{display:flex;align-items:center;gap:14px;text-align:left;font-weight:500}
.infobox .lfi{flex:none;width:44px;height:44px;border-radius:50%;background:#FFFFFF;display:grid;place-items:center;color:var(--floresta)}
.infobox .lfi .ic{width:22px;height:22px}
.said{background:var(--floresta);color:var(--creme);border-radius:22px;padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.said span{font-size:.8125rem;color:var(--on-dark-muted);font-weight:600}
.said b{font-family:var(--serif);font-weight:400;font-size:1.5rem;line-height:1.1;color:var(--argila-on-dark)}
.said p{font-size:.9375rem;color:var(--creme)}
.icard .pic img{width:100%;height:100%;object-fit:cover;object-position:center 62%;display:block}
.icards.ages .pic img{object-position:center 22%}
.q-sonho .pic img{object-position:center 40%}
.qpic > img{aspect-ratio:16/10;object-position:center 52%}
.crowd span img{width:100%;height:100%;object-fit:cover;object-position:center 20%;display:block}
.pill{align-self:stretch;text-align:center;font-size:.9375rem;font-weight:600;color:var(--argila-ink);background:var(--argila-soft);border:1px solid #EBD6C6;border-radius:16px;padding:11px 14px;display:flex;align-items:center;justify-content:center;gap:8px}
.pill .ic{width:18px;height:18px}
.intro-h{text-align:center;font-size:clamp(2.125rem,9.6vw,2.75rem)}
.intro-h em{color:var(--argila-ink)}
.ask{font-size:1rem;font-weight:600;text-align:center;color:var(--musgo);margin-top:2px}
.icards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.icard{all:unset;box-sizing:border-box;cursor:pointer;background:var(--branco);border:1.5px solid var(--line-soft);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow);transition:border-color .2s,transform .15s var(--ease)}
.icard:hover{border-color:var(--salvia)}
.icard:active{transform:scale(.98)}
.icard .pic{display:block;aspect-ratio:1/.92;background:var(--linho);overflow:hidden}
.icard .pic svg{width:100%;height:100%}
.icard .cap{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;font-weight:600;font-size:1rem;line-height:1.25;transition:background .2s,color .2s}
.icard .cap .ic{width:18px;height:18px;color:var(--argila-ink);flex:none}
.icard[aria-pressed="true"]{border-color:var(--floresta)}
.icard[aria-pressed="true"] .cap{background:var(--floresta);color:var(--creme)}
.icard[aria-pressed="true"] .cap .ic{color:var(--argila-on-dark)}
.icards.ages .pic{aspect-ratio:4/3.3}
.icard.wide{grid-column:1/-1;flex-direction:row}
.icard.wide .pic{width:42%;aspect-ratio:auto;min-height:110px}
.icard.wide .cap{flex:1}
.icard .cap small{display:block;font-weight:500;font-size:.8125rem;color:var(--musgo);transition:color .2s}
.icard[aria-pressed="true"] .cap small{color:var(--on-dark-muted)}
.qpic{border-radius:24px;overflow:hidden;background:var(--salvia-soft)}
.qpic svg{width:100%;height:auto}
/* quebra: prova social e botão fixo */
.okay{text-align:center;font-size:.9375rem;font-weight:700;color:var(--musgo);letter-spacing:.02em}
.okay b{color:var(--argila-ink);font-weight:700}
.crowd{display:flex;justify-content:center;padding:4px 0}
.crowd span{width:74px;height:74px;border-radius:50%;overflow:hidden;border:3px solid var(--creme);margin-left:-14px;background:var(--linho)}
.crowd span:first-child{margin-left:0}
.crowd span svg{width:100%;height:100%}
.proof{font-family:var(--serif);font-size:clamp(1.75rem,7.6vw,2.125rem);line-height:1.08;text-align:center;text-wrap:balance}
.proof em{color:var(--argila-ink)}
.proof .big{display:block;font-size:1.9em;line-height:1;color:var(--argila-ink);font-style:normal}
.infobox{background:var(--salvia-soft);border:1px solid #D3DCCD;border-radius:16px;padding:13px 16px;text-align:center;font-weight:600;color:var(--floresta)}
.trust{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;color:var(--musgo);font-size:.8125rem;font-weight:500}
.trust span{display:flex;align-items:center;gap:5px}
.trust .ic{width:15px;height:15px}

/* folhas (telas de explicação) */
.sheet{background:var(--branco);border-radius:24px;padding:20px 18px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.sheet.dark{background:var(--floresta);color:var(--creme)}
.sheet.dark .src,.sheet.dark .fine{color:var(--on-dark-muted)}
.sheet.dark h3 em{color:var(--argila-on-dark)}
.sheet.linho{background:var(--linho);box-shadow:none}
.stamp{align-self:center;display:inline-flex;align-items:center;gap:7px;font-size:.875rem;font-weight:600;color:var(--floresta);background:var(--salvia-soft);border-radius:999px;padding:7px 14px 7px 10px}
.stamp .ic{width:17px;height:17px;color:var(--argila-ink)}
.stat{display:flex;align-items:baseline;gap:12px}
.stat b{font-family:var(--serif);font-weight:400;font-size:3.25rem;line-height:.9;color:var(--argila-on-dark);white-space:nowrap;letter-spacing:-.02em}
.stat span{font-size:.9375rem;line-height:1.35}
.provacard{position:relative;overflow:hidden;background:#FFFFFF;border:1px solid var(--line);border-radius:24px;padding:22px 20px 20px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.provacard .pc-curve{position:absolute;right:-4px;top:-4px;width:130px;height:130px;pointer-events:none;transform:scaleY(-1)}
.provacard > *:not(.pc-curve){position:relative}
.provacard .pc-curve svg{width:100%;height:100%}
.provacard .pc-curve path{stroke-dasharray:200;stroke-dashoffset:200;animation:draw 1.8s .3s var(--ease) forwards}
.pc-faixa{font-size:.8125rem;font-weight:600;letter-spacing:.16em;color:var(--floresta);font-variant-numeric:tabular-nums}
.pc-faixa i{font-style:normal;color:var(--musgo);opacity:.7}
.pc-num{font-family:var(--serif);font-weight:400;font-size:clamp(4rem,19vw,5.25rem);line-height:.92;letter-spacing:-.02em;color:var(--floresta);font-variant-numeric:tabular-nums;margin-top:2px}
.pc-tit{font-family:var(--serif);font-size:clamp(1.625rem,7vw,2rem);line-height:1.06;color:var(--floresta);text-wrap:balance;max-width:16ch}
.pc-bar{display:flex;align-items:center;gap:12px;margin:8px 0 4px}
.pc-bar span{flex:1;height:14px;border-radius:99px;background:var(--linho);overflow:hidden}
.pc-bar i{display:block;height:100%;border-radius:99px;background:var(--musgo);width:var(--w);animation:fillbar 1.2s .2s var(--ease) both}
@keyframes fillbar{from{width:0}}
.pc-bar b{font-size:.9375rem;font-weight:600;font-variant-numeric:tabular-nums}
.pc-txt{font-size:.9375rem;color:var(--floresta);line-height:1.45;max-width:34ch;position:relative}
.pc-sign{font-family:var(--serif);font-style:italic;font-size:1.0625rem;color:var(--floresta);margin-top:6px;position:relative}
.chart{width:100%;height:auto;overflow:visible}
.chartcard{margin:0}
.chartcard .stat b{color:var(--argila-ink)}
.chartcard figcaption{display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--line-soft);padding-top:12px}
.chartcard figcaption b{font-weight:600;font-size:.9375rem}
.chartcard figcaption span{font-size:.8125rem;color:var(--musgo)}
.chartbox{margin:4px -4px 0}
.chartcard .legend{flex-wrap:wrap;gap:6px 14px;font-size:.75rem}
.chartcard .legend i{width:18px;height:10px;border-radius:2px}
.lg-faixa{background:rgba(184,116,79,.22)}
.lg-forte{height:0!important;border-top:2.5px solid #9A5A39;border-radius:0!important}
.lg-leve{height:0!important;border-top:2px dashed #9A5A39;border-radius:0!important}
.chart text{font-family:var(--sans);font-size:11px;font-weight:500}
.split{display:flex;height:54px;border-radius:14px;overflow:hidden;font-weight:600;font-size:.875rem}
.split div{display:flex;flex-direction:column;justify-content:center;padding:0 12px;line-height:1.15}
.split div small{font-weight:500;font-size:.75rem;opacity:.85}
.split .fat{background:var(--salvia);color:var(--floresta)}
.split .lean{background:var(--argila-cta);color:var(--branco)}
.legend{display:flex;gap:14px;font-size:.8125rem;color:var(--musgo)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:block}

.mirror{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.mirror li{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:start;padding:12px 0;border-top:1px solid var(--line-soft)}
.mirror li:first-child{border-top:0;padding-top:0}
.mirror li:last-child{padding-bottom:0}
.mirror .tile{width:40px;height:40px;border-radius:12px;background:var(--argila-soft);color:var(--argila-ink);display:grid;place-items:center}
.mirror b{display:block;line-height:1.3}
.mirror span{font-size:.9rem;color:var(--musgo);line-height:1.4}
.gauge{display:flex;flex-direction:column;gap:7px}
.gauge .row{display:flex;justify-content:space-between;align-items:baseline;font-size:.9rem;gap:10px}
.gauge .row b{font-variant-numeric:tabular-nums}
.gauge .track{height:12px;border-radius:99px;background:var(--line-soft);overflow:hidden}
.gauge .track i{display:block;height:100%;border-radius:99px;width:0;transition:width 1.1s var(--ease)}

.swap{display:grid;grid-template-columns:1fr 34px 1fr;align-items:stretch;gap:0}
.swap .card{border-radius:20px;padding:16px 12px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px}
.swap .no{background:var(--linho)}
.swap .yes{background:var(--floresta);color:var(--creme)}
.swap .tile{width:52px;height:52px;border-radius:16px;display:grid;place-items:center}
.swap .no .tile{background:var(--creme);color:var(--musgo)}
.swap .yes .tile{background:rgba(244,240,232,.1);color:var(--argila-on-dark)}
.swap .tile .ic{width:28px;height:28px}
.swap .name{font-size:.875rem;font-weight:500;line-height:1.3;min-height:3.4em}
.swap .g{font-family:var(--serif);font-size:2.25rem;line-height:1;font-variant-numeric:tabular-nums}
.swap .no .g{color:var(--musgo)}
.swap .yes .g{color:var(--argila-on-dark)}
.swap small{font-size:.75rem;opacity:.8}
.swap .arrow{display:grid;place-items:center;color:var(--argila)}
.swap .arrow .ic{width:20px;height:20px}
.rules{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.rules li{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:start}
.rules .n{width:30px;height:30px;border-radius:50%;background:var(--floresta);color:var(--creme);display:grid;place-items:center;font-family:var(--serif);font-size:1.125rem;line-height:1}
.rules b{display:block}
.rules span{font-size:.9rem;color:var(--musgo)}

/* peso */
.measures{display:flex;flex-direction:column;gap:10px}
.weight{display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px 16px 12px;background:var(--branco);border-radius:24px;box-shadow:var(--shadow)}
.weight .lbl{align-self:flex-start;font-size:.8125rem;font-weight:600;color:var(--musgo);margin-bottom:-14px}
.weight .val{font-family:var(--serif);font-size:3.25rem;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.weight .val small{font-family:var(--sans);font-size:1.125rem;color:var(--musgo);margin-left:6px;letter-spacing:0}
.weight .row{display:flex;align-items:center;gap:12px;width:100%}
.step{all:unset;cursor:pointer;flex:none;width:52px;height:52px;border-radius:50%;background:var(--creme);display:grid;place-items:center;color:var(--floresta);transition:background .2s}
.step:hover{background:var(--linho)}
.step .ic{width:22px;height:22px}
input[type=range]{flex:1;min-width:0;height:36px;accent-color:var(--floresta);background:transparent}
.ruler{display:flex;justify-content:space-between;width:100%;padding:0 64px;font-size:.75rem;color:var(--musgo);font-variant-numeric:tabular-nums;margin-top:-8px}
.imc-live{align-self:center;display:flex;align-items:baseline;gap:8px;background:var(--floresta);color:var(--creme);border-radius:999px;padding:8px 16px;font-size:.875rem}
.imc-live b{font-family:var(--serif);font-weight:400;font-size:1.375rem;line-height:1;color:var(--argila-on-dark);font-variant-numeric:tabular-nums}
.imc-live span{color:var(--on-dark-muted)}
.bmi{display:flex;flex-direction:column;gap:8px}
.bmi .bhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.bmi .bhead b{font-family:var(--serif);font-weight:400;font-size:2.5rem;line-height:1;font-variant-numeric:tabular-nums}
.bmi .bhead small{font-family:var(--sans);font-size:.875rem;font-weight:600;color:var(--musgo);margin-right:6px}
.bmi .bhead span{font-size:.9375rem;font-weight:600;text-align:right}
.bmi .scale{position:relative;padding-top:12px}
.bmi .bands{display:flex;height:10px;border-radius:99px;overflow:hidden;gap:2px}
.bmi .bands i{display:block;height:100%}
.bmi .pin{position:absolute;top:0;width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-top:9px solid var(--floresta);margin-left:-7px}
.bmi .ticks{position:relative;height:16px;font-size:.72rem;color:var(--musgo);font-variant-numeric:tabular-nums}
.bmi .ticks span{position:absolute;transform:translateX(-50%)}

/* carregamento */
.loader{display:flex;flex-direction:column;align-items:center;gap:22px;padding-top:6px}
.loader .big{width:200px;height:92px}
.loader .pct{font-family:var(--serif);font-size:3.5rem;line-height:1;font-variant-numeric:tabular-nums;margin-top:-6px}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;width:100%;background:var(--branco);border-radius:22px;padding:18px;box-shadow:var(--shadow)}
.checks li{display:flex;align-items:center;gap:12px;font-weight:500;color:var(--musgo);transition:color .3s}
.checks .t{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);flex:none;display:grid;place-items:center;transition:background .3s,border-color .3s}
.checks .t svg{width:12px;height:12px;stroke:var(--branco);stroke-width:3;fill:none;opacity:0;transition:opacity .3s}
.checks li.done{color:var(--floresta)}
.checks li.done .t{background:var(--floresta);border-color:var(--floresta)}
.checks li.done .t svg{opacity:1}
.tip{width:100%;background:var(--linho);border-radius:22px;padding:16px 18px;display:flex;flex-direction:column;gap:4px;min-height:104px}
.tip b{font-family:var(--serif);font-size:1.25rem;font-weight:400;line-height:1.15}
.tip b em{color:var(--argila-ink)}
.tip span{font-size:.9375rem;color:var(--musgo)}
.tip.swapin{animation:in .5s var(--ease) both}

/* resultado */
.rhead{background:var(--floresta);color:var(--creme);border-radius:28px;padding:24px 20px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.rhead .ok{display:flex;align-items:center;gap:8px;font-size:.875rem;font-weight:600;color:var(--salvia)}
.rhead .ok .ic{width:18px;height:18px}
.rhead h1{color:var(--creme);font-size:clamp(2rem,9vw,2.5rem)}
.rhead h1 em{color:var(--argila-on-dark)}
.rhead p{color:var(--on-dark-muted)}
.rhead .goal{display:flex;align-items:center;gap:12px;background:rgba(244,240,232,.08);border:1px solid rgba(244,240,232,.12);border-radius:16px;padding:8px 14px 8px 8px}
.rhead .goal .pic{flex:none;width:56px;height:56px;border-radius:12px;overflow:hidden;background:var(--linho)}
.rhead .goal .pic svg{width:100%;height:100%}
.rhead .goal .pic img{width:100%;height:100%;object-fit:cover;object-position:center 55%}
.rhead .goal span{font-size:.8125rem;color:var(--on-dark-muted);display:block}
.rhead .goal b{font-family:var(--serif);font-weight:400;font-size:1.375rem;line-height:1.1;color:var(--creme)}
.offer .acc{font-size:.8125rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--musgo);margin-bottom:-6px}
.rhead .facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
.rhead .facts div{background:rgba(244,240,232,.08);border:1px solid rgba(244,240,232,.12);border-radius:14px;padding:10px 8px;text-align:center;display:flex;flex-direction:column;gap:2px}
.rhead .facts b{font-family:var(--serif);font-weight:400;font-size:1.5rem;line-height:1;color:var(--creme);font-variant-numeric:tabular-nums}
.rhead .facts span{font-size:.72rem;color:var(--on-dark-muted);line-height:1.25}
.rhead .facts b.bmiv{color:var(--argila-on-dark)}
.scores{display:flex;flex-direction:column;gap:14px}
.score .row{display:flex;justify-content:space-between;align-items:baseline;font-size:.9375rem;gap:10px}
.score .row b{font-variant-numeric:tabular-nums}
.score .track{height:10px;border-radius:99px;background:var(--line-soft);overflow:hidden;margin-top:7px}
.score .track i{display:block;height:100%;border-radius:99px;width:0;transition:width 1.2s var(--ease)}
.meta{display:flex;align-items:center;gap:14px}
.meta .ring{flex:none;width:76px;height:76px}
.vs{display:grid;grid-template-columns:1fr 1fr;border-radius:22px;overflow:hidden;box-shadow:var(--shadow)}
.vs .col{display:flex;flex-direction:column;min-width:0}
.vs .hd{padding:13px 10px;text-align:center;font-family:var(--serif);font-size:1.25rem;line-height:1.1}
.vs .no{background:var(--branco)}
.vs .no .hd{background:var(--linho);color:var(--musgo)}
.vs .yes{background:var(--salvia-soft)}
.vs .yes .hd{background:var(--floresta);color:var(--creme)}
.vs .yes .hd em{color:var(--argila-on-dark)}
.vs .it{padding:11px 10px;font-size:.875rem;line-height:1.3;border-top:1px solid var(--line-soft);display:flex;gap:7px;align-items:flex-start;min-height:62px}
.vs .it .ic{width:16px;height:16px;margin-top:1px}
.vs .no .it .ic{color:var(--danger)}
.vs .yes .it .ic{color:var(--floresta)}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{display:flex;align-items:center;gap:5px;font-size:.8125rem;font-weight:600;border-radius:999px;padding:5px 11px;background:var(--salvia-soft);color:var(--floresta)}
.chip .ic{width:14px;height:14px}
.day{background:var(--branco);border-radius:24px;overflow:hidden;box-shadow:var(--shadow)}
.day .hd{background:var(--floresta);color:var(--creme);padding:13px 18px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.day .hd b{font-family:var(--serif);font-weight:400;font-size:1.5rem;line-height:1}
.day .hd small{font-size:.8125rem;color:var(--on-dark-muted)}
.meal{display:grid;grid-template-columns:44px 1fr;gap:12px;padding:14px 18px;border-top:1px solid var(--line-soft);align-items:start}
.day .meal:first-of-type{border-top:0}
.meal .tile{width:44px;height:44px;border-radius:13px;background:var(--creme);display:grid;place-items:center;color:var(--floresta)}
.meal .when{display:block;font-size:.75rem;font-weight:600;color:var(--argila-ink);letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
.meal .pt{display:inline-block;margin-top:6px;font-size:.75rem;font-weight:600;color:var(--floresta);background:var(--salvia-soft);border-radius:999px;padding:3px 9px;font-variant-numeric:tabular-nums}
.note{border-radius:20px;padding:14px 16px;background:var(--argila-soft);display:grid;grid-template-columns:22px 1fr;gap:10px;font-size:.9375rem}
.note .ic{color:var(--argila-ink);margin-top:1px}
.note strong{display:block}
.covers{display:flex;gap:8px;padding:14px 2px 4px}
.cover{flex:1;min-width:0;aspect-ratio:.72;border-radius:10px;padding:9px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 2px 4px rgba(23,51,43,.12),0 8px 16px rgba(23,51,43,.1)}
.cover:nth-child(2){transform:translateY(-6px)}
.cover:nth-child(3){transform:translateY(-10px)}
.cover .cm{width:24px;height:11px}
.cover.foto{padding:0;overflow:hidden}
.cover.foto img{width:100%;height:100%;object-fit:cover;display:block}
.extras h3.xh{font-family:var(--serif);font-weight:400;font-size:1.625rem;line-height:1.1;text-align:center}
.extras h3.xh em{font-style:italic;color:var(--argila-ink)}
.fila{overflow:hidden;margin:2px -20px 4px;padding:10px 0 14px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.fila-in{display:flex;gap:12px;width:max-content;animation:fila 26s linear infinite}
.fila-in img{width:112px;aspect-ratio:2/3;height:auto;border-radius:10px;display:block;box-shadow:0 2px 4px rgba(23,51,43,.14),0 10px 20px rgba(23,51,43,.14)}
@keyframes fila{to{transform:translateX(calc(-50% - 6px))}}
.cover b{font-family:var(--serif);font-weight:400;font-size:1rem;line-height:1.02}
.cover b i{display:block}
.cover hr{border:0;height:1.5px;width:40%;margin:0;border-radius:1px}
.deliv{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.deliv li{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:start}
.deliv li.seu{background:#FFF6EF;border:1.5px solid var(--argila);border-radius:16px;padding:12px;margin-inline:-6px}
.deliv .seu-tag{display:inline-block;font-size:.6875rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#FFFFFF;background:var(--argila-cta);border-radius:999px;padding:3px 9px;margin-bottom:5px}
.deliv .quando{display:block;font-family:var(--serif);font-size:1.0625rem;line-height:1.2;color:var(--argila-ink);margin:1px 0 3px}
.deliv-lead{text-align:center;color:var(--musgo);font-size:.9375rem;margin-top:-4px}
.deliv .tile{width:40px;height:40px;border-radius:12px;background:var(--creme);display:grid;place-items:center;color:var(--floresta)}
.deliv b{display:block;line-height:1.25;font-size:1.0625rem}
.deliv span{font-size:.875rem;color:var(--musgo);line-height:1.35}
.offer{background:var(--branco);border:2px solid var(--floresta);border-radius:28px;padding:22px 18px;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center;box-shadow:var(--shadow-lift);scroll-margin-top:90px}
.offer h2{font-size:1.875rem}
.offer .for{color:var(--musgo);font-size:.9375rem}
.offer .de{color:var(--musgo);text-decoration:line-through;font-size:.9375rem}
.offer .por{font-family:var(--serif);font-size:3.25rem;line-height:.9;color:var(--floresta);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.offer .por small{font-family:var(--sans);font-size:1.125rem;font-weight:600;vertical-align:.95em;margin-right:4px;letter-spacing:0}
.offer .sub{color:var(--musgo);font-size:.875rem}
.pay{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.pay span{display:flex;align-items:center;gap:5px;font-size:.75rem;font-weight:600;border:1px solid var(--line);border-radius:8px;padding:4px 9px;color:var(--musgo)}
.pay .ic{width:14px;height:14px}
.guarantee{display:flex;gap:12px;align-items:center;text-align:left;font-size:.9rem;background:var(--creme);border-radius:18px;padding:12px 14px;width:100%}
.seal{flex:none;width:58px;height:58px}
.author{display:flex;gap:14px;align-items:center}
.author .ph{flex:none;width:68px;height:68px;border-radius:50%;overflow:hidden;background:var(--salvia-soft);display:grid;place-items:center;font-family:var(--serif);color:var(--floresta);font-size:1.6rem;border:2px solid var(--argila)}
.author .ph img{width:100%;height:100%;object-fit:cover}
.author .reg{font-size:.8125rem;color:var(--musgo)}
.chat{background:var(--linho);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:10px}
.bubble{background:var(--branco);align-self:flex-start;border-radius:4px 16px 16px 16px;padding:10px 13px;max-width:92%;font-size:.9375rem;box-shadow:var(--shadow)}
.bubble .who{display:block;font-size:.75rem;color:var(--musgo);margin-top:4px;font-weight:600}
.faq{display:flex;flex-direction:column}
details{border-top:1px solid var(--line-soft);padding-block:14px}
details:first-of-type{border-top:0;padding-top:4px}
summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px}
summary::-webkit-details-marker{display:none}
summary .ic{width:18px;height:18px;color:var(--argila-ink);transition:transform .3s var(--ease)}
details[open] summary .ic{transform:rotate(45deg)}
details p{margin-top:8px;color:var(--musgo);font-size:.9375rem}
.setup{border:1.5px dashed var(--argila);background:var(--argila-soft);border-radius:16px;padding:12px 14px;font-size:.875rem;display:flex;flex-direction:column;gap:4px;text-align:left;width:100%}
.setup code{font-family:ui-monospace,Menlo,monospace;font-size:.8rem}
.sticky{position:fixed;left:0;right:0;bottom:0;background:rgba(255,253,249,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-top:1px solid var(--line-soft);box-shadow:0 -8px 20px rgba(23,51,43,.08);padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));z-index:5;animation:up .5s var(--ease) both}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sticky .in{max-width:30rem;margin-inline:auto;display:flex;align-items:center;gap:12px}
.sticky .p{display:flex;flex-direction:column;line-height:1.05}
.sticky .p b{font-family:var(--serif);font-weight:400;font-size:1.625rem;white-space:nowrap;font-variant-numeric:tabular-nums}
.sticky .p small{font-size:.72rem;color:var(--musgo)}
.sticky .btn{min-height:52px;font-size:1rem}
/* ===== Tema: a marca além da caneta no fundo branco =====
   Mesmas cores e fontes do guia; o creme vira o fundo dos blocos de apoio. A força vem de tamanho, contraste e
   dos blocos de destaque, não de trocar de identidade. */
:root{
  --creme:#FFFFFF; --branco:#FFFFFF; --linho:#F4F0E8; --line:#E6E0D4; --line-soft:#EFEAE1;
  --vermelho:#A4442C; --verde:#17332B; --verde-vivo:#17332B;
}
body{background:#FFFFFF}
h1,h2{line-height:1.04}
.top{position:static;padding-top:10px}
.top.quiz{display:block}
.top.quiz .bar{min-height:48px;grid-template-columns:44px 1fr 44px}
.top.quiz .logo{display:flex}
.progress .track{height:5px;background:var(--linho)}
.progress .fill{height:5px}
.opt,.icard,.age{border-color:var(--line)}
.opt .tile{background:var(--linho)}
.icard .pic{background:var(--linho)}
/* abertura */
.hook-h{font-size:clamp(2.125rem,9.4vw,2.75rem);line-height:1.02;text-wrap:balance}
.hook-h .tag{display:inline-block;vertical-align:.3em;font-family:var(--sans);font-size:.36em;font-weight:700;letter-spacing:.12em;text-transform:uppercase;background:var(--danger);color:#FFFFFF;border-radius:999px;padding:.35em .9em;margin-right:.3em}
.hook-h em{color:var(--danger)}
/* aviso e evidência */
.warn{font-family:var(--sans);font-weight:500;font-size:clamp(1.375rem,6vw,1.625rem);line-height:1.25;letter-spacing:-.01em;text-align:center;text-wrap:balance}
.warn .r{font-weight:700}
.warn .gg{font-weight:700}
.hl{background:var(--danger);color:#FFFFFF;font-weight:700;font-style:normal;padding:0 .22em;border-radius:6px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
h2.sans,h1.sans{font-family:var(--sans);font-weight:500;letter-spacing:-.015em;line-height:1.22;font-size:clamp(1.5rem,6.6vw,1.875rem)}
.hook-h.sans{font-size:clamp(1.75rem,7.6vw,2.125rem);line-height:1.22}
.hook-h.sans i{font-style:italic}
.hook-h.sans .tag{font-size:1em;font-weight:700;letter-spacing:0;text-transform:none;vertical-align:baseline;padding:0 .22em;border-radius:6px;margin-right:.08em;line-height:inherit;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.opt.feat{border:2px solid var(--argila-cta);background:#FBF3EE;font-weight:700;box-shadow:0 0 0 4px rgba(184,116,79,.14)}
.opt.feat .tile{background:var(--argila-cta);color:#FFFFFF}
.opt.feat[aria-pressed="true"]{background:var(--floresta);border-color:var(--floresta)}
.logo{flex-direction:column;gap:3px}
.logo .kick{font-family:var(--sans);font-size:.625rem;font-weight:700;letter-spacing:.26em;color:var(--argila-ink)}
.logo .lrow{display:flex;align-items:center;gap:8px}
.count{justify-self:end;font-size:.8125rem;font-weight:600;color:var(--musgo);font-variant-numeric:tabular-nums;white-space:nowrap}
.warn .r{color:var(--danger)}
.warn .gg{color:var(--argila-ink);font-style:italic}
.see{text-align:center;font-weight:600;text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--argila)}
.paper{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#FFFFFF;box-shadow:var(--shadow)}
.paper .pbar{background:var(--floresta);color:var(--creme);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.paper .pbar span{color:var(--on-dark-muted)}
.paper .pin{padding:16px;display:flex;flex-direction:column;gap:12px}
.midia{margin:0;display:flex;flex-direction:column;gap:8px}
.midia figcaption{font-weight:600;text-align:center}
.midia img{width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.midia .src{overflow-wrap:anywhere;text-align:center}
.paper .pin b{font-family:var(--serif);font-weight:400;font-size:1.5rem;line-height:1.12}

// limite tracejado (−3%) e contínuo (−8%), rotulados direto na ponta.
const muscleChart = (faixa) => {
  const idades = [30, 40, 50, 60, 70];
  const L = 34, W = 214, T = 22, Hh = 150, ymin = 70, ymax = 100;
  const x = (a) => L + 12 + ((a - 30) / 40) * (W - 12);
  const y = (v) => T + ((ymax - v) / (ymax - ymin)) * Hh;
  const leve = idades.map((_, k) => 100 * 0.97 ** k);
  const forte = idades.map((_, k) => 100 * 0.92 ** k);
  const linha = (vs) => vs.map((v, k) => `${k ? 'L' : 'M'}${x(idades[k]).toFixed(1)} ${y(v).toFixed(1)}`).join(' ');
  const area = `${linha(leve)} ${forte.slice().reverse().map((v, k) => `L${x(idades[4 - k]).toFixed(1)} ${y(v).toFixed(1)}`).join(' ')} Z`;
  const dec = {i30: [30, 40], i40: [40, 50], i50: [50, 60], i60: [60, 70]}[faixa];
  const voce = dec
    ? `<rect x="${x(dec[0])}" y="${T - 4}" width="${x(dec[1]) - x(dec[0])}" height="${Hh + 4}" rx="6" style="fill:#17332B;fill-opacity:.06"/>
       <rect x="${(x(dec[0]) + x(dec[1])) / 2 - 22}" y="${T - 20}" width="44" height="16" rx="8" style="fill:#17332B"/>
       <text x="${(x(dec[0]) + x(dec[1])) / 2}" y="${T - 9}" text-anchor="middle" style="fill:#FFFFFF;font-weight:700;font-size:10px">VOCÊ</text>`
    : `<line x1="${x(30)}" x2="${x(30)}" y1="${T - 4}" y2="${T + Hh}" style="stroke:#17332B;stroke-width:1.5;stroke-dasharray:2 3"/>
       <text x="${x(30) + 6}" y="${T - 8}" style="fill:#17332B;font-weight:700;font-size:10px">VOCÊ CHEGA AQUI AOS 30</text>`;
  const grade = [70, 80, 90, 100].map((v) => `<line x1="${L + 4}" x2="${L + W}" y1="${y(v)}" y2="${y(v)}" style="stroke:#E6E0D4;stroke-width:1"/><text x="${L - 6}" y="${y(v) + 3.5}" text-anchor="end" style="fill:#4A5E52">${v}%</text>`).join('');
  const eixoX = idades.map((a) => `<text x="${x(a)}" y="${T + Hh + 16}" text-anchor="middle" style="fill:#4A5E52">${a}</text>`).join('');
  const pontos = (vs, nome) => vs.map((v, k) => `<circle cx="${x(idades[k])}" cy="${y(v)}" r="3.5" style="fill:#FFFFFF;stroke:#9A5A39;stroke-width:2"><title>${idades[k]} anos, ${nome}: ${Math.round(v)}%</title></circle>`).join('');
  const ponta = (v, rotulo, dy) => `<text x="${L + W + 8}" y="${y(v) + dy}" style="fill:#17332B;font-weight:700;font-size:13px">${Math.round(v)}%</text><text x="${L + W + 8}" y="${y(v) + dy + 13}" style="fill:#4A5E52;font-size:10px">${rotulo}</text>`;
  return `<svg class="chart" viewBox="0 0 320 200" role="img" aria-label="Massa muscular a partir dos 30 anos, com 100% aos 30: perdendo 3% por década chega a ${Math.round(leve[4])}% aos 70; perdendo 8% por década chega a ${Math.round(forte[4])}%.">
    ${grade}${voce}
    <path d="${area}" style="fill:#B8744F;fill-opacity:.16"/>
    <path d="${linha(leve)}" style="fill:none;stroke:#9A5A39;stroke-width:2;stroke-dasharray:5 4;stroke-linecap:round"/>
    <path d="${linha(forte)}" style="fill:none;stroke:#9A5A39;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round"/>
    ${pontos(forte, 'perdendo 8% por década')}
    ${ponta(leve[4], '−3% por década', -2)}${ponta(forte[4], '−8% por década', 2)}
    ${eixoX}<text x="${L + W}" y="${T + Hh + 30}" text-anchor="end" style="fill:#4A5E52;font-size:10px">idade</text>
  </svg>`;
};

  const items = ['Analisando as suas respostas', 'Cruzando com a sua idade e o seu IMC', 'Calculando a proteína que o seu corpo pede', 'Preparando o seu resultado'];
  const ul = el('ul', {class: 'checks'}, items.map((t) => el('li', {}, H('span', markSvg, 't'), t)));
  const mark = H('div', capsuleSvg('big', '#17332B', '#B8744F', 0));
  const pct = el('div', {class: 'pct', 'aria-hidden': 'true'}, '0%');
  const tip = el('div', {class: 'tip', role: 'note'});
  let ti = -1;
  const showTip = () => { ti = (ti + 1) % DICAS.length; tip.classList.remove('swapin'); void tip.offsetWidth; tip.classList.add('swapin'); tip.innerHTML = `<b>${DICAS[ti][0]}</b><span>${DICAS[ti][1]}</span>`; };
  showTip();
  const total = reduceMotion ? 1200 : 5200;
  const t0 = performance.now();
  let lastTip = t0;
  const tick = (now) => {
    if (STEPS[state.i].type !== 'loading') return;
    const p = Math.min(1, (now - t0) / total);
    const v = Math.min(100, Math.round((p < 0.75 ? p * 1.05 : 0.7875 + (p - 0.75) * 0.85) * 100));
    const path = mark.querySelector('path');
    if (path) path.setAttribute('stroke-dashoffset', String(62 * (1 - v / 100)));
    pct.textContent = v + '%';
    [...ul.children].forEach((li, k) => li.classList.toggle('done', v >= (k + 1) * 24));
    if (now - lastTip > 2400) { lastTip = now; showTip(); }
    if (p < 1) requestAnimationFrame(tick);
    else setTimeout(() => {
      if (STEPS[state.i].type !== 'loading') return;
      send('concluido', {etapa: QUESTION_IDX.length + 1, passo: 'concluido', perfil: perfilId()});
      track('QuizCompleto', {}, true);
      conta('conclusao');

  return [H('h2', 'Analisando o seu <em>corpo e a sua rotina</em>'), el('p', {class: 'hint'}, 'Leva só alguns segundos.'),
    el('div', {class: 'loader', role: 'status', 'aria-label': 'Analisando as suas respostas'}, mark, pct, ul, tip)];
};

/* ---------- Movimento da última página ----------
   Cada bloco entra quando chega na tela (de baixo, da esquerda ou da direita), as listas entram em cascata,
   os números contam e o preço cai de R$ 249 até o valor final. Sem IntersectionObserver ou com redução de
   movimento, nada disso roda e a página aparece inteira e parada. */
const contar = (node, de, para, ms, fmt) => {
  const t0 = performance.now();
  const passo = (now) => {
    const p = Math.min(1, (now - t0) / ms);
    const e = 1 - Math.pow(1 - p, 3);
    node.textContent = fmt(de + (para - de) * e);
    if (p < 1) requestAnimationFrame(passo);
  };
  requestAnimationFrame(passo);
};
const animarResultado = (barras) => {
  const marcar = (sel, dir = 'up', gap = 0, base = 0) => document.querySelectorAll(sel).forEach((n, k) => {
    n.classList.add('rv', 'rv-' + dir);
    n.style.setProperty('--d', `${base + k * gap}s`);
  });
  marcar('#screen > *');
  marcar('.ba > div:first-child', 'l', 0, .1); marcar('.ba > div:last-child', 'r', 0, .25);
  marcar('.goalpic figcaption', 'up', 0, .35);
  marcar('.vs .col.no .it', 'l', .09, .15); marcar('.vs .col.yes .it', 'r', .09, .3);
  marcar('.rhead .goal', 'up', 0, .2); marcar('.rhead .facts div', 'pop', .1, .3);
  marcar('.scores .score', 'l', .12, .1);
  marcar('.day .meal', 'r', .1, .15);
  marcar('.cover', 'pop', .1, .1); marcar('.deliv li', 'l', .07, .1);
  marcar('.gains li', 'l', .12, .15);
  marcar('.vstack li', 'r', .08, .1); marcar('.vmais', 'up', 0, .1); marcar('.vtotal', 'up', 0, .1); marcar('.today', 'pop', 0, .15);
  marcar('.faq details', 'up', .06, 0);
  const io = new IntersectionObserver((es) => es.forEach((e) => {
    if (!e.isIntersecting) return;
    const n = e.target;
    n.classList.add('in');
    io.unobserve(n);
    if (n.matches('.facts div')) {
      const b = n.querySelector('b'); const m = b && b.textContent.match(/^([\d.,]+)(.*)$/);
      if (m) { const v = parseFloat(m[1].replace(',', '.')); const dec = m[1].includes(',') ? 1 : 0;
        contar(b, 0, v, 1100, (x) => x.toFixed(dec).replace('.', ',') + m[2]); }
    }
    if (n.matches('.today')) {
      const pn = n.querySelector('.pn');
      if (pn) contar(pn, Number(pn.dataset.de), Number(pn.dataset.para), 1600, (x) => x.toFixed(2).replace('.', ','));
    }
    if (n.querySelector && n.querySelector('.scores')) setTimeout(barras, 250);
  }), {threshold: .12, rootMargin: '0px 0px -6% 0px'});
  document.querySelectorAll('.rv').forEach((n) => io.observe(n));
};

/* ---------- Render ---------- */
const RENDER = {hook: renderHook, intro: renderIntro, age: renderAge, buttons: renderButtons, cards: renderCards, multi: renderMulti, insight: renderInsight,
  weight: renderWeight, mirror: renderMirror, solution: renderSolution, loading: renderLoading, result: renderResult};
const render = () => {
  const s = STEPS[state.i];
  const qi = QUESTION_IDX.indexOf(state.i);
  back.hidden = state.i === 0 || s.type === 'loading';
  progress.hidden = state.i === 0 || s.type === 'result';
  const w = s.type === 'loading' ? 100 : Math.round(((qi + 1) / (QUESTION_IDX.length + 1)) * 100);
  progressFill.style.width = w + '%';
  progressCap.style.left = `calc(${w}% - ${(w * 0.24).toFixed(1)}px)`;
  // Como na referência: nas perguntas só aparecem o voltar e o progresso; a marca fica na abertura e no resultado.
  topBar.classList.toggle('quiz', state.i > 0 && s.type !== 'result');
  $('#count').textContent = String(state.i + 1);
  if (s.type !== 'result') sticky.hidden = true;
  screen.replaceChildren(...RENDER[s.type](s).filter(Boolean));
  screen.style.animation = 'none';
  void screen.offsetWidth;
  screen.style.animation = '';
  if (qi >= 0) conta('etapa', qi + 1); // alcance da etapa (ao chegar nela); voltar e avançar não conta de novo
  const first = screen.querySelector('h1,h2');
  if (first && state.i > 0) { first.setAttribute('tabindex', '-1'); try { first.focus({preventScroll: true}); } catch (e) {} }
};
conta('visita');
render();
// As fotos da idade e das barrigas já começam a baixar na primeira tela (depois do vídeo, que tem prioridade).
const preload = () => [CONFIG.imagens.caneta, ...Object.values(CONFIG.imagens.idade), ...Object.values(CONFIG.imagens.barriga), ...Object.values(CONFIG.imagens.sonho)].filter(Boolean).forEach((u) => { const i = new Image(); i.src = u; });
if ('requestIdleCallback' in window) requestIdleCallback(preload); else setTimeout(preload, 800);
</script>
